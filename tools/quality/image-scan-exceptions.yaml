# Committed exceptions for `make audit-images`.
#
# Policy (F-01):
#   * Only FIXED (fixable) HIGH/CRITICAL findings may be excepted. Unfixed
#     findings are reported but never block, so they need no exception.
#   * Every exception requires all seven approval fields below; the checker
#     (tools/quality/image-scan-exceptions-check.sh) fails the gate on any
#     missing field, `approved` other than `true`, an invalid digest, or an
#     expired / over-30-day `expires` date.
#   * `expires` is an ISO date (YYYY-MM-DD) at most 30 days after the date the
#     exception is recorded. When it passes, the exception must be renewed or
#     the pin refreshed.
#   * `digest` is the exact sha256 of the image the exception applies to.
#   * `image` is the exact final image or its digest-pinned OCI base reference.
#     Base inheritance requires exact `package` and `installed_version` fields;
#     only unchanged findings match. No image-name-only or global-CVE inheritance.
#   * `reachable` documents the reachability rationale; `owner` is the
#     accountable operator or team.
#
# Schema:
#   - id: CVE-2026-00000
#     image: postgres:15-alpine@sha256:...
#     digest: sha256:...
#     owner: platform@geoguessme.dev
#     reachable: "one-line rationale"
#     approved: true
#     expires: 2026-08-30
#
# Exceptions below were recorded 2026-08-15 during the F-01 pin refresh. All
# images are at their newest compatible stable release; each excepted finding
# is fixed in a newer Go/grpc/x-text release that upstream has not yet rebuilt
# into any published image (no newer tag exists). Revisit before 2026-10-11.

# --- lscr.io/linuxserver/socket-proxy:latest (digest-pinned upstream image;
# Alpine 3.24.1 still carries OpenSSL 3.5.7 while the registry image has not
# yet rebuilt against 3.5.8. The proxy is configured without TLS/QUIC, binds
# only to loopback, and is not reachable from the public tunnel.) ---
- id: CVE-2026-14456
  image: lscr.io/linuxserver/socket-proxy:latest@sha256:7f932344a3a66a2a54a34001e8e78e60ec14dcd9c522e74a5b6420ac9db18afd
  digest: sha256:7f932344a3a66a2a54a34001e8e78e60ec14dcd9c522e74a5b6420ac9db18afd
  owner: security-program
  reachable: "OpenSSL QUIC denial of service is not reachable because this proxy has no TLS or QUIC listener and is loopback-bound; upstream has not rebuilt the newest image with OpenSSL 3.5.8"
  approved: true
  expires: 2026-10-18

