# Committed exceptions for `make audit-images`.
#
# Policy (F-01):
#   * Only FIXED (fixable) HIGH/CRITICAL findings may be excepted. Unfixed
#     findings are reported but never block, so they need no exception.
#   * Every exception requires all seven fields below; the checker
#     (tools/quality/image-scan-exceptions-check.sh) fails the gate on any
#     missing field, `approved` other than `true`, an invalid digest, or an
#     expired / over-30-day `expires` date.
#   * `expires` is an ISO date (YYYY-MM-DD) at most 30 days after the date the
#     exception is recorded. When it passes, the exception must be renewed or
#     the pin refreshed.
#   * `digest` is the exact sha256 of the image the exception applies to.
#   * `image` is the exact image reference scanned (the same string passed to
#     `docker save` / `AUDIT_IMAGES`).
#   * `reachable` documents the reachability rationale; `owner` is the
#     accountable operator or team.
#
# Schema:
#   - id: CVE-2026-00000
#     image: postgres:15-alpine@sha256:...
#     digest: sha256:...
#     owner: platform@geoguessme.dev
#     reachable: "one-line rationale"
#     approved: true
#     expires: 2026-08-30
#
# Exceptions below were recorded 2026-08-15 during the F-01 pin refresh. All
# images are at their newest compatible stable release; each excepted finding
# is fixed in a newer Go/grpc/x-text release that upstream has not yet rebuilt
# into any published image (no newer tag exists). Revisit before 2026-09-09.

