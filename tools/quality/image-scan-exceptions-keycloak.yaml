# Time-boxed Keycloak exceptions for `make audit-images`.
# Keycloak 26.7.3 fixes the Keycloak-services account-takeover CVE and removes
# the obsolete dependency findings. The remaining Microsoft SQL Server driver
# is bundled upstream but not used: this deployment uses PostgreSQL only. The
# Netty SNI finding is not reachable because Keycloak serves plain HTTP behind
# the TLS-terminating gateway and does not configure per-SNI mTLS.

