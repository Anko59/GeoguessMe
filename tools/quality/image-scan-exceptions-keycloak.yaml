# Time-boxed Keycloak exceptions for `make audit-images`.
# Keycloak 26.7.4 fixes the Keycloak-services account-takeover CVE and removes
# the vulnerable OS packages. The remaining Microsoft SQL Server driver is
# bundled upstream but not used: this deployment uses PostgreSQL only. The
# Netty SNI finding is not reachable because Keycloak serves plain HTTP behind
# the TLS-terminating gateway and does not configure per-SNI mTLS. The
# Bouncy Castle jar is bundled only in the administrative client; kcadm talks
# to the internal plain-HTTP endpoint, so its certificate-parsing path is not
# reachable in this deployment.

- id: CVE-2025-59250
  image: quay.io/keycloak/keycloak:26.7.4@sha256:82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c
  digest: sha256:82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c
  owner: security-program
  reachable: "the vulnerable Microsoft SQL Server driver is bundled but this deployment uses only PostgreSQL"
  approved: true
  expires: 2026-10-21
