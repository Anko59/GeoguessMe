APIError:
  type: object
  required: [error]
  properties:
    error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

AuthUser:
  type: object
  required: [id, username]
  properties:
    id: { type: string, format: uuid }
    username: { type: string }
    email:
      type: [string, "null"]
      format: email
      description: >
        The verified contact address, present only after the account has
        verified a claim. Email is a recovery/contact channel, not an
        authorization identity; an unverified account simply has no email.
    pending_email:
      type: string
      format: email
      description: >
        The current unverified contact claim. The verified email stays active
        until this claim is successfully verified.
    email_verified_at: { type: [string, "null"], format: date-time }
    avatar: { type: string }

AuthResponse:
  type: object
  required: [access_token, expires_in, user]
  properties:
    access_token: { type: string }
    expires_in: { type: integer }
    user: { $ref: "#/AuthUser" }

ProgressionRank:
  type: object
  required: [level, name, min_points, points_in_rank, points_to_next, progress_percent, trophy_key]
  properties:
    level: { type: integer, minimum: 1, maximum: 20 }
    name: { type: string }
    min_points: { type: integer, minimum: 0 }
    next_points: { type: integer, minimum: 0 }
    points_in_rank: { type: integer, minimum: 0 }
    points_to_next: { type: integer, minimum: 0 }
    progress_percent: { type: integer, minimum: 0, maximum: 100 }
    trophy_key: { type: string }
    next_rank:
      $ref: "#/ProgressionRank"
      description: The following rank, omitted at the highest rank.

GlobalRank:
  type: object
  required: [rank, total_players]
  properties:
    rank:
      type: integer
      minimum: 0
      description: >
        Position among every player who has guessed at least once, ordered by
        lifetime points using standard competition ranking. Zero while the
        player has no guesses of their own.
    total_players:
      type: integer
      minimum: 0
      description: Number of players who have guessed at least once.

Profile:
  allOf:
    - $ref: "#/AuthUser"
    - type: object
      required: [total_points, guess_count, average_score, elo, rank, global_rank, global_average_rank, global_elo_rank]
      properties:
        total_points: { type: integer, minimum: 0 }
        guess_count: { type: integer, minimum: 0 }
        average_score: { type: number, minimum: 0 }
        elo:
          { type: integer, minimum: 0, description: Global Elo rating; 0 while never compared against another guesser. }
        rank: { $ref: "#/ProgressionRank" }
        global_rank: { $ref: "#/GlobalRank" }
        global_average_rank: { $ref: "#/GlobalRank" }
        global_elo_rank: { $ref: "#/GlobalRank" }

PublicProfile:
  type: object
  required:
    [
      id,
      username,
      avatar,
      total_points,
      guess_count,
      average_score,
      elo,
      rank,
      global_rank,
      global_average_rank,
      global_elo_rank,
    ]
  properties:
    id: { type: string }
    username: { type: string }
    avatar: { type: string }
    total_points: { type: integer, minimum: 0 }
    guess_count: { type: integer, minimum: 0 }
    average_score: { type: number, minimum: 0 }
    elo: { type: integer, minimum: 0 }
    rank: { $ref: "#/ProgressionRank" }
    global_rank: { $ref: "#/GlobalRank" }
    global_average_rank: { $ref: "#/GlobalRank" }
    global_elo_rank: { $ref: "#/GlobalRank" }
  description: >
    Another player's progression profile. Never contains email or account
    details; only visible when the player shares a group with the requester.

Group:
  type: object
  required: [id, name, created_at]
  properties:
    id: { type: string, format: uuid }
    name: { type: string }
    created_at: { type: string, format: date-time }

InviteToken:
  type: string
  minLength: 43
  maxLength: 43
  pattern: "^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$"
  description: Canonical 32-byte base64url bearer token from a group invite link.

InviteCreateRequest:
  type: object
  required: [group_id]
  properties:
    group_id: { type: string, format: uuid }

InviteCreateResponse:
  type: object
  required: [id, group_id, token, invite_url, created_at, expires_at]
  properties:
    id: { type: string, format: uuid }
    group_id: { type: string, format: uuid }
    token: { $ref: "#/InviteToken" }
    invite_url:
      {
        type: string,
        format: uri-reference,
        description: "Join path carrying the token in a fragment (/group/join#invite=<token>); clients prepend their origin to build a shareable link.",
      }
    created_at: { type: string, format: date-time }
    expires_at: { type: string, format: date-time }

InviteListItem:
  type: object
  required: [id, creator_user_id, created_at, expires_at, revoked]
  properties:
    id: { type: string, format: uuid }
    creator_user_id: { type: string, format: uuid }
    created_at: { type: string, format: date-time }
    expires_at: { type: string, format: date-time }
    revoked: { type: [string, "null"], format: date-time }

InvitePreviewRequest:
  type: object
  required: [invite_token]
  properties:
    invite_token: { $ref: "#/InviteToken" }

InvitePreview:
  type: object
  required: [group_name, member_count]
  properties:
    group_name: { type: string }
    member_count: { type: integer, minimum: 0 }

GroupPhoto:
  type: object
  required: [group_id, mime_type, byte_size, created_at]
  properties:
    group_id: { type: string, format: uuid }
    mime_type: { type: string, enum: [image/jpeg] }
    byte_size: { type: integer, minimum: 1 }
    created_at: { type: string, format: date-time }

GroupNotificationPreference:
  type: object
  required: [enabled]
  properties:
    enabled: { type: boolean }

Member:
  type: object
  required: [id, username]
  properties:
    id: { type: string, format: uuid }
    username: { type: string }
    avatar: { type: string }

LeaderboardEntry:
  type: object
  required: [user_id, username, avatar, score, guess_count, average_score, total_points, elo, rank]
  properties:
    user_id: { type: string, format: uuid }
    username: { type: string }
    avatar: { type: string }
    score: { type: integer, description: Sum of all guess scores in the selected period. }
    guess_count: { type: integer }
    average_score: { type: number, description: Average guess score in the selected period. }
    total_points: { type: integer, minimum: 0, description: Lifetime guess points used for rank progression. }
    elo:
      {
        type: integer,
        minimum: 0,
        description: Elo rating computed from the selected period's challenges; 0 while the player never compared against another guesser on a shared challenge in the period.,
      }
    rank: { $ref: "#/ProgressionRank" }

Message:
  type: object
  required: [id, group_id, user_id, kind, created_at]
  properties:
    id: { type: string, format: uuid }
    group_id: { type: string, format: uuid }
    user_id: { type: string, format: uuid }
    username: { type: string }
    avatar: { type: string }
    kind: { type: string, enum: [text, challenge, media, system] }
    photo_id: { type: [string, "null"], format: uuid }
    media_id: { type: [string, "null"], format: uuid }
    media_type: { type: string, enum: [image/jpeg, image/png, video/mp4, video/webm] }
    reply_to_id: { type: [string, "null"], format: uuid }
    content: { type: string }
    created_at: { type: string, format: date-time }
    challenge_status:
      {
        type: string,
        enum: [available, accepted, guessed, results, expired],
        description: Viewer-specific action state for challenge messages,
      }
    challenge_resolved: { type: boolean, description: Whether any group member has answered the challenge }
    challenge_expires_at:
      type: string
      format: date-time
      description: >-
        Challenge deadline (upload time + TTL), present on challenge messages.
    challenge_ttl_seconds:
      type: integer
      minimum: 1
      description: >-
        Challenge duration in seconds, present on challenge messages.
    reactions: { type: array, items: { $ref: "#/MessageReaction" } }
    reaction_update: { $ref: "#/MessageReactionUpdate" }

ReactionKey:
  type: string
  enum: [like, love, laugh, wow, sad, spot-on, lost, mind-blown, wrong-way, vacation, 👍, ❤️, 😂, 😮, 😢, 🙏]
  description: >
    Reaction identity. The ten keys map to custom artwork shown in the UI; the
    six legacy emoji values are still accepted so existing reactions keep
    working.

MessageReaction:
  type: object
  required: [reaction, count, reacted, usernames]
  properties:
    reaction: { $ref: "#/ReactionKey" }
    count: { type: integer, minimum: 1 }
    reacted: { type: boolean, description: Whether the authenticated viewer selected this reaction }
    usernames:
      type: array
      items: { type: string }
      description: Usernames of group members who selected this reaction

MessageReactionRequest:
  type: object
  description: Supply the reaction key to set or remove.
  required: [reaction]
  properties:
    reaction: { $ref: "#/ReactionKey" }

MessageReactionUpdate:
  type: object
  description: WebSocket-only reaction mutation metadata used to preserve each recipient's viewer-specific state.
  required: [user_id, reaction, active]
  properties:
    user_id: { type: string, format: uuid }
    reaction: { $ref: "#/ReactionKey" }
    active: { type: boolean }

MessagesPage:
  type: object
  required: [items]
  properties:
    items: { type: array, items: { $ref: "#/Message" } }
    next_cursor: { type: [string, "null"] }
    stable_cursor:
      {
        type: [string, "null"],
        description: Opaque cursor strictly after the last message of the page; the reconnect catch-up anchor (empty for an empty page),
      }

ChallengeCreated:
  type: object
  required: [id, group_id, expires_at, created_at, server_time]
  properties:
    id: { type: string, format: uuid }
    group_id: { type: string, format: uuid }
    expires_at: { type: string, format: date-time }
    created_at: { type: string, format: date-time }
    server_time: { type: string, format: date-time }

ChallengeAccepted:
  type: object
  required:
    [photo_id, media_url, media_type, accepted_at, view_expires_at, guess_after, challenge_expires_at, server_time]
  properties:
    photo_id: { type: string, format: uuid }
    media_url: { type: string }
    media_type: { type: string, enum: [image/jpeg, image/png, video/mp4, video/webm] }
    accepted_at: { type: string, format: date-time }
    view_expires_at: { type: string, format: date-time }
    guess_after: { type: string, format: date-time }
    challenge_expires_at: { type: string, format: date-time }
    server_time: { type: string, format: date-time }

ChallengeMediaDelivered:
  type: object
  required: [view_expires_at, guess_after, server_time]
  properties:
    view_expires_at: { type: string, format: date-time }
    guess_after: { type: string, format: date-time }
    server_time: { type: string, format: date-time }

GuessResponse:
  type: object
  required: [guess_id, photo_id, score, distance, created_at, duplicate, server_time]
  properties:
    guess_id: { type: string, format: uuid }
    photo_id: { type: string, format: uuid }
    score: { type: integer }
    distance: { type: number }
    created_at: { type: string, format: date-time }
    duplicate: { type: boolean }
    server_time: { type: string, format: date-time }

ChallengeResults:
  type: object
  required: [photo_id, group_id, guesses, media_available, server_time]
  properties:
    photo_id: { type: string, format: uuid }
    group_id: { type: string, format: uuid }
    actual_lat: { type: number, format: double, description: Omitted while the poster hides the location }
    actual_long: { type: number, format: double, description: Omitted while the poster hides the location }
    location_hidden: { type: boolean, description: True when the poster hid the location and it is not yet revealed }
    location_reveals_at:
      { type: string, format: date-time, description: When the hidden location becomes visible on the results page }
    guesses: { type: array, items: { $ref: "#/Guess" } }
    media_available: { type: boolean }
    media_url: { type: [string, "null"] }
    media_type: { type: [string, "null"], enum: [image/jpeg, image/png, video/mp4, video/webm, null] }
    server_time: { type: string, format: date-time }

Guess:
  type: object
  required: [id, photo_id, user_id, group_id, score, created_at]
  properties:
    id: { type: string, format: uuid }
    photo_id: { type: string, format: uuid }
    user_id: { type: string, format: uuid }
    group_id: { type: string, format: uuid }
    lat:
      {
        type: number,
        format: double,
        description: Omitted for other players' guesses while a hidden-location challenge is still hidden; only the viewer's own guessed point is returned.,
      }
    long: { type: number, format: double, description: Omitted alongside lat while the location is hidden. }
    score: { type: integer }
    distance: { type: number, description: Omitted alongside the coordinates while the location is hidden. }
    created_at: { type: string, format: date-time }
    username: { type: string }
    avatar: { type: string }

PushSubscriptionRequest:
  type: object
  required: [endpoint, keys]
  properties:
    endpoint: { type: string, format: uri }
    keys:
      type: object
      required: [p256dh, auth]
      properties:
        p256dh: { type: string, description: "Base64url 65-byte uncompressed P-256 public key" }
        auth: { type: string, description: "Base64url 16-byte authentication secret" }
