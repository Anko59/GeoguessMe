"PublicChallenge":
  "type": "object"
  "required":
    [
      "id",
      "user_id",
      "username",
      "avatar",
      "caption",
      "created_at",
      "is_owner",
      "resolved",
      "reaction_count",
      "reacted",
      "comment_count",
    ]
  "properties":
    "id":
      "type": "string"
      "format": "uuid"
    "user_id":
      "type": "string"
      "format": "uuid"
    "username":
      "type": "string"
    "avatar":
      "type": "string"
    "caption":
      "type": "string"
      "maxLength": 280
    "audience":
      "type": "string"
      "enum": ["public", "friends"]
      "description": "Public is visible to all signed-in users. Friends is visible to shared-group members, optionally limited to selected groups."
    "created_at":
      "type": "string"
      "format": "date-time"
    "is_owner":
      "type": "boolean"
    "resolved":
      "type": "boolean"
      "description": "True only after this viewer submits a guess."
    "reaction_count":
      "type": "integer"
      "minimum": 0
    "reacted":
      "type": "boolean"
    "comment_count":
      "type": "integer"
      "minimum": 0
"PublicFeedPage":
  "type": "object"
  "required": ["items", "next_cursor"]
  "properties":
    "items":
      "type": "array"
      "items":
        "$ref": "#/PublicChallenge"
    "next_cursor":
      "type": "string"
"PublicFeedLeaderboardEntry":
  "type": "object"
  "required": ["rank", "user_id", "username", "avatar", "total_score"]
  "properties":
    "rank":
      "type": "integer"
      "minimum": 1
    "user_id":
      "type": "string"
      "format": "uuid"
    "username":
      "type": "string"
    "avatar":
      "type": "string"
    "total_score":
      "type": "integer"
      "minimum": 0
"PublicFeedLeaderboardPage":
  "type": "object"
  "required": ["items", "next_cursor"]
  "properties":
    "items":
      "type": "array"
      "items":
        "$ref": "#/PublicFeedLeaderboardEntry"
    "next_cursor":
      "type": "string"
"PublicComment":
  "type": "object"
  "required": ["id", "user_id", "username", "avatar", "content", "created_at", "can_delete"]
  "properties":
    "id":
      "type": "string"
      "format": "uuid"
    "user_id":
      "type": "string"
      "format": "uuid"
    "username":
      "type": "string"
    "avatar":
      "type": "string"
    "content":
      "type": "string"
      "minLength": 1
      "maxLength": 1000
    "created_at":
      "type": "string"
      "format": "date-time"
    "can_delete":
      "type": "boolean"
"PublicCommentsPage":
  "type": "object"
  "required": ["items", "next_cursor"]
  "properties":
    "items":
      "type": "array"
      "items":
        "$ref": "#/PublicComment"
    "next_cursor":
      "type": "string"
"PublicGuessResult":
  "type": "object"
  "required": ["score", "distance", "lat", "long", "actual_lat", "actual_long"]
  "properties":
    "score":
      "type": "integer"
      "minimum": 0
      "maximum": 5000
    "distance":
      "type": "number"
      "minimum": 0
      "description": "Distance in meters."
    "lat":
      "type": "number"
    "long":
      "type": "number"
    "actual_lat":
      "type": "number"
    "actual_long":
      "type": "number"
"PublicFeedResult":
  "type": "object"
  "required": ["rank", "user_id", "username", "avatar", "score", "distance", "elo_delta", "is_viewer"]
  "properties":
    "rank":
      "type": "integer"
      "minimum": 1
    "user_id":
      "type": "string"
      "format": "uuid"
    "username":
      "type": "string"
    "avatar":
      "type": "string"
    "score":
      "type": "integer"
      "minimum": 0
      "maximum": 5000
    "distance":
      "type": "number"
      "minimum": 0
      "description": "Distance in meters."
    "elo_delta":
      "type": "integer"
      "description": "Signed all-time Elo change caused by this challenge in the global history replay."
    "is_viewer":
      "type": "boolean"

"PublicChallengeAccepted":
  "type": "object"
  "required":
    [
      "challenge_id",
      "media_url",
      "media_type",
      "accepted_at",
      "view_expires_at",
      "guess_after",
      "guess_expires_at",
      "score_grace_seconds",
      "server_time",
    ]
  "properties":
    "challenge_id": { "type": "string", "format": "uuid" }
    "media_url": { "type": "string" }
    "media_type": { "type": "string", "enum": ["image/jpeg", "image/png", "image/webp"] }
    "accepted_at": { "type": "string", "format": "date-time" }
    "view_expires_at": { "type": "string", "format": "date-time" }
    "guess_after": { "type": "string", "format": "date-time" }
    "guess_expires_at":
      { "type": "string", "format": "date-time", "description": "Server-authoritative deadline for the timed guess." }
    "score_grace_seconds": { "type": "integer", "minimum": 0 }
    "server_time": { "type": "string", "format": "date-time" }

"PublicChallengeMediaDelivered":
  "type": "object"
  "required": ["view_expires_at", "guess_after", "guess_expires_at", "score_grace_seconds", "server_time"]
  "properties":
    "view_expires_at": { "type": "string", "format": "date-time" }
    "guess_after": { "type": "string", "format": "date-time" }
    "guess_expires_at": { "type": "string", "format": "date-time" }
    "score_grace_seconds": { "type": "integer", "minimum": 0 }
    "server_time": { "type": "string", "format": "date-time" }

"PublicTimedGuessResponse":
  "type": "object"
  "required": ["guess_id", "challenge_id", "score", "timed_out", "created_at", "duplicate", "server_time"]
  "properties":
    "guess_id": { "type": "string", "format": "uuid" }
    "challenge_id": { "type": "string", "format": "uuid" }
    "score": { "type": "integer", "minimum": 0, "maximum": 5000 }
    "distance":
      { "type": "number", "minimum": 0, "description": "Distance in meters; omitted for authoritative timeouts." }
    "timed_out": { "type": "boolean" }
    "created_at": { "type": "string", "format": "date-time" }
    "duplicate": { "type": "boolean" }
    "server_time": { "type": "string", "format": "date-time" }

"PublicTimedResultGuess":
  "type": "object"
  "required": ["id", "user_id", "username", "avatar", "score", "timed_out", "created_at"]
  "properties":
    "id": { "type": "string", "format": "uuid" }
    "user_id": { "type": "string", "format": "uuid" }
    "username": { "type": "string" }
    "avatar": { "type": "string" }
    "lat": { "type": "number", "format": "double" }
    "long": { "type": "number", "format": "double" }
    "score": { "type": "integer", "minimum": 0, "maximum": 5000 }
    "distance": { "type": "number", "minimum": 0, "description": "Distance in meters; omitted for timeouts." }
    "timed_out": { "type": "boolean" }
    "created_at": { "type": "string", "format": "date-time" }

"PublicTimedResults":
  "type": "object"
  "required": ["challenge_id", "actual_lat", "actual_long", "guesses", "server_time"]
  "properties":
    "challenge_id": { "type": "string", "format": "uuid" }
    "actual_lat": { "type": "number", "format": "double" }
    "actual_long": { "type": "number", "format": "double" }
    "guesses": { "type": "array", "items": { "$ref": "#/PublicTimedResultGuess" } }
    "server_time": { "type": "string", "format": "date-time" }
