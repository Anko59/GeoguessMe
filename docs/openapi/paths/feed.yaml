"guess":
  "parameters": [{ "name": "id", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }]
  "get":
    "operationId": "getPublicGuess"
    "summary": "Read your completed guess and the answer"
    "tags": ["Feed"]
    "security": [{ "bearerAuth": [] }]
    "responses":
      "200":
        "description": "Success"
        "content":
          "application/json":
            "schema":
              "$ref": "../components/schemas-feed.yaml#/PublicGuessResult"
      "400":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "401":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "404":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "429":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "500":
        "$ref": "../components/responses.yaml#/ErrorResponse"
  "post":
    "operationId": "guessPublicChallenge"
    "summary": "Record one immutable guess and reveal the answer"
    "tags": ["Feed"]
    "security": [{ "bearerAuth": [] }]
    "description": "Repeated submissions return the original result. Public scores do not contribute to private group rankings or profile progression."
    "requestBody":
      "required": true
      "content":
        "application/json":
          "schema":
            "type": "object"
            "required": ["lat", "long"]
            "additionalProperties": false
            "properties":
              "lat":
                "type": "number"
                "minimum": -90
                "maximum": 90
              "long":
                "type": "number"
                "minimum": -180
                "maximum": 180
    "responses":
      "200":
        "description": "Success"
        "content":
          "application/json":
            "schema":
              "$ref": "../components/schemas-feed.yaml#/PublicGuessResult"
      "400":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "401":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "403":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "404":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "429":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "500":
        "$ref": "../components/responses.yaml#/ErrorResponse"
