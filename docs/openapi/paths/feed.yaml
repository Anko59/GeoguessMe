"feed":
  "get":
    "operationId": "getPublicFeed"
    "summary": "Browse public challenges, newest first"
    "tags": ["Feed"]
    "security": [{ "bearerAuth": [] }]
    "parameters":
      [
        { "name": "cursor", "in": "query", "required": false, "schema": { "type": "string", "maxLength": 256 } },
        {
          "name": "limit",
          "in": "query",
          "required": false,
          "schema": { "type": "integer", "minimum": 1, "maximum": 50, "default": 20 },
        },
      ]
    "responses":
      "200":
        "description": "Success"
        "content":
          "application/json":
            "schema":
              "$ref": "../components/schemas-feed.yaml#/PublicFeedPage"
      "400":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "401":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "404":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "429":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "500":
        "$ref": "../components/responses.yaml#/ErrorResponse"
"leaderboard":
  "get":
    "operationId": "getPublicFeedLeaderboard"
    "summary": "Rank the community by total public feed score"
    "description": "Returns usernames and total feed score only. Profile details remain protected by the existing shared-group visibility rules."
    "tags": ["Feed"]
    "security": [{ "bearerAuth": [] }]
    "parameters":
      [
        { "name": "cursor", "in": "query", "required": false, "schema": { "type": "string", "maxLength": 256 } },
        {
          "name": "limit",
          "in": "query",
          "required": false,
          "schema": { "type": "integer", "minimum": 1, "maximum": 50, "default": 20 },
        },
      ]
    "responses":
      "200":
        "description": "Stable cursor page ordered by total feed score, username, and user ID."
        "content":
          "application/json":
            "schema":
              "$ref": "../components/schemas-feed.yaml#/PublicFeedLeaderboardPage"
      "400":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "401":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "429":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "500":
        "$ref": "../components/responses.yaml#/ErrorResponse"
"upload":
  "post":
    "operationId": "createPublicChallenge"
    "summary": "Publish a photo challenge with an explicit audience"
    "tags": ["Feed"]
    "security": [{ "bearerAuth": [] }]
    "requestBody":
      "required": true
      "content":
        "multipart/form-data":
          "schema":
            "type": "object"
            "required": ["photo", "lat", "long"]
            "properties":
              "photo":
                "type": "string"
                "format": "binary"
                "description": "JPG, PNG or WebP, within configured upload limits."
              "caption":
                "type": "string"
                "maxLength": 280
              "audience":
                "type": "string"
                "enum": ["public", "friends"]
                "default": "public"
                "description": "Friends posts are visible to users sharing a group with the author."
              "group_id":
                "type": "array"
                "maxItems": 20
                "items":
                  "type": "string"
                  "format": "uuid"
                "description": "Repeated multipart field. Optional selected groups for a friends post; the author must belong to every selected group."
              "lat":
                "type": "number"
                "minimum": -90
                "maximum": 90
              "long":
                "type": "number"
                "minimum": -180
                "maximum": 180
    "responses":
      "201":
        "description": "Success"
        "content":
          "application/json":
            "schema":
              "type": "object"
              "required": ["id"]
              "properties":
                "id":
                  "type": "string"
                  "format": "uuid"
      "400":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "401":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "404":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "429":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "500":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "502":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "503":
        "$ref": "../components/responses.yaml#/ErrorResponse"
