"comments":
  "parameters": [{ "name": "id", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }]
  "get":
    "operationId": "getPublicComments"
    "summary": "Read comments, newest first; comments may contain spoilers"
    "tags": ["Feed"]
    "security": [{ "bearerAuth": [] }]
    "parameters":
      [
        { "name": "cursor", "in": "query", "required": false, "schema": { "type": "string", "maxLength": 256 } },
        {
          "name": "limit",
          "in": "query",
          "required": false,
          "schema": { "type": "integer", "minimum": 1, "maximum": 50, "default": 20 },
        },
      ]
    "responses":
      "200":
        "description": "Success"
        "content":
          "application/json":
            "schema":
              "$ref": "../components/schemas-feed.yaml#/PublicCommentsPage"
      "400":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "401":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "404":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "429":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "500":
        "$ref": "../components/responses.yaml#/ErrorResponse"
  "post":
    "operationId": "commentPublicChallenge"
    "summary": "Add a comment to a public challenge"
    "tags": ["Feed"]
    "security": [{ "bearerAuth": [] }]
    "requestBody":
      "required": true
      "content":
        "application/json":
          "schema":
            "type": "object"
            "required": ["content"]
            "additionalProperties": false
            "properties":
              "content":
                "type": "string"
                "minLength": 1
                "maxLength": 1000
    "responses":
      "201":
        "description": "Success"
        "content":
          "application/json":
            "schema":
              "$ref": "../components/schemas-feed.yaml#/PublicComment"
      "400":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "401":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "404":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "429":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "500":
        "$ref": "../components/responses.yaml#/ErrorResponse"
