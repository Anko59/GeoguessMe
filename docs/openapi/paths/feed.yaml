"feed":
  "get":
    "operationId": "getPublicFeed"
    "summary": "Browse public challenges, newest first"
    "tags": ["Feed"]
    "security": [{ "bearerAuth": [] }]
    "parameters":
      [
        { "name": "cursor", "in": "query", "required": false, "schema": { "type": "string", "maxLength": 256 } },
        {
          "name": "limit",
          "in": "query",
          "required": false,
          "schema": { "type": "integer", "minimum": 1, "maximum": 50, "default": 20 },
        },
      ]
    "responses":
      "200":
        "description": "Success"
        "content":
          "application/json":
            "schema":
              "$ref": "../components/schemas-feed.yaml#/PublicFeedPage"
      "400":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "401":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "404":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "429":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "500":
        "$ref": "../components/responses.yaml#/ErrorResponse"
"upload":
  "post":
    "operationId": "createPublicChallenge"
    "summary": "Publish a photo challenge visible to all signed-in users"
    "tags": ["Feed"]
    "security": [{ "bearerAuth": [] }]
    "requestBody":
      "required": true
      "content":
        "multipart/form-data":
          "schema":
            "type": "object"
            "required": ["photo", "lat", "long"]
            "properties":
              "photo":
                "type": "string"
                "format": "binary"
                "description": "JPG, PNG or WebP, within configured upload limits."
              "caption":
                "type": "string"
                "maxLength": 500
              "lat":
                "type": "number"
                "minimum": -90
                "maximum": 90
              "long":
                "type": "number"
                "minimum": -180
                "maximum": 180
    "responses":
      "201":
        "description": "Success"
        "content":
          "application/json":
            "schema":
              "type": "object"
              "required": ["id"]
              "properties":
                "id":
                  "type": "string"
                  "format": "uuid"
      "400":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "401":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "404":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "429":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "500":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "502":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "503":
        "$ref": "../components/responses.yaml#/ErrorResponse"
"post":
  "parameters": [{ "name": "id", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }]
  "get":
    "operationId": "getPublicChallenge"
    "summary": "Read a public challenge without revealing its answer"
    "tags": ["Feed"]
    "security": [{ "bearerAuth": [] }]
    "responses":
      "200":
        "description": "Success"
        "content":
          "application/json":
            "schema":
              "$ref": "../components/schemas-feed.yaml#/PublicChallenge"
      "400":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "401":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "404":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "429":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "500":
        "$ref": "../components/responses.yaml#/ErrorResponse"
  "delete":
    "operationId": "deletePublicChallenge"
    "summary": "Delete your public post and its comments and reactions"
    "tags": ["Feed"]
    "security": [{ "bearerAuth": [] }]
    "responses":
      "204":
        "description": "Deleted; physical photo deletion is queued."
      "400":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "401":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "404":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "429":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "500":
        "$ref": "../components/responses.yaml#/ErrorResponse"
"media":
