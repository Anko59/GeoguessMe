  "get":
    "operationId": "getPublicChallengeMedia"
    "summary": "Read a blurred preview, or the original for an owner or resolved viewer"
    "tags": ["Feed"]
    "security": [{ "bearerAuth": [] }]
    "responses":
      "200":
        "description": "Private image bytes. Feed media is a reduced preview for unresolved viewers; play explicitly opens the original for guessing."
        "content":
          "image/jpeg":
            "schema":
              "type": "string"
              "format": "binary"
          "image/png":
            "schema":
              "type": "string"
              "format": "binary"
      "400":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "401":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "404":
        "$ref": "../components/responses.yaml#/ErrorResponse"
      "410":
