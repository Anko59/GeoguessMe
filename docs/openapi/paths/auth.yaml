signup:
  post:
    operationId: signup
    summary: Create a legacy account when Keycloak is disabled.
    description: Normal signup uses Keycloak. This compatibility endpoint returns 410 while OIDC is enabled.
    tags: [Authentication]
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [username, password]
            properties:
              username: { type: string, minLength: 3, maxLength: 30, pattern: "^[a-zA-Z0-9_-]+$" }
              email: { type: string, format: email, description: Optional recovery/contact claim. }
              password: { type: string, minLength: 8, maxLength: 128 }
    responses:
      "200":
        description: Account created and session issued.
        content: { application/json: { schema: { $ref: "../components/schemas.yaml#/AuthResponse" } } }
      "400": { $ref: "../components/responses.yaml#/ErrorResponse" }
      "409": { $ref: "../components/responses.yaml#/ErrorResponse" }
      "410": { $ref: "../components/responses.yaml#/ErrorResponse" }

login:
  post:
    operationId: login
    summary: Start a temporary legacy migration session.
    description: Hidden from normal login; accepts an unmigrated legacy account by its username or verified/pending email address and issues a read-only session while OIDC is enabled.
    tags: [Authentication]
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [username, password]
            properties:
              username: { type: string, description: Legacy username or email address. }
              password: { type: string }
    responses:
      "200":
        description: Session issued.
        content: { application/json: { schema: { $ref: "../components/schemas.yaml#/AuthResponse" } } }
      "401": { $ref: "../components/responses.yaml#/ErrorResponse" }

oidcConfig:
  get:
    operationId: getOIDCConfig
    summary: Report whether Keycloak sign-in is enabled.
    tags: [Authentication]
    security: []
    responses:
      "200":
        description: Runtime identity capability.
        content: { application/json: { schema: { $ref: "../components/schemas.yaml#/OIDCConfig" } } }
      "405": { $ref: "../components/responses.yaml#/ErrorResponse" }

oidcSession:
  post:
    operationId: exchangeOIDCSession
    summary: Exchange the OAuth2 Proxy Keycloak session for an application session.
    description: Keycloak tokens are forwarded server-to-server by OAuth2 Proxy and are never returned to browser JavaScript. A genuinely new identity receives username_required until it submits an explicit GeoGuessMe username; existing identities and verified-email migrations do not need one.
    tags: [Authentication]
    security: [{ oidcProxyAuth: [] }]
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              username:
                type: string
                minLength: 3
                maxLength: 30
                pattern: "^[A-Za-z0-9_-]+$"
    responses:
      "200":
        description: Existing identity resolved, verified-email account linked, or new account provisioned with its chosen username.
        content: { application/json: { schema: { $ref: "../components/schemas.yaml#/AuthResponse" } } }
      "400": { $ref: "../components/responses.yaml#/ErrorResponse" }
      "401": { $ref: "../components/responses.yaml#/ErrorResponse" }
      "409": { $ref: "../components/responses.yaml#/ErrorResponse" }
      "503": { $ref: "../components/responses.yaml#/ErrorResponse" }

oidcLink:
  post:
    operationId: startOIDCLink
    summary: Start linking Keycloak to the authenticated application account.
    tags: [Authentication]
    security: [{ bearerAuth: [] }]
    responses:
      "204": { description: Single-use link intent stored in an HttpOnly cookie. }
      "401": { $ref: "../components/responses.yaml#/ErrorResponse" }
      "503": { $ref: "../components/responses.yaml#/ErrorResponse" }

refresh:
  post:
    operationId: refreshSession
    summary: Rotate the refresh session.
    tags: [Authentication]
    security: [{ cookieAuth: [] }]
    responses:
      "200":
        description: Tokens rotated.
        content: { application/json: { schema: { $ref: "../components/schemas.yaml#/AuthResponse" } } }
      "401": { $ref: "../components/responses.yaml#/ErrorResponse" }

logout:
  post:
    operationId: logout
    summary: Revoke a session.
    tags: [Authentication]
    security: []
    parameters:
      - { name: all, in: query, schema: { type: string, enum: ["1"] } }
    responses:
      "204": { description: Logged out. }
      "401": { $ref: "../components/responses.yaml#/ErrorResponse" }

requestVerification:
  post:
    operationId: requestVerification
    summary: Request email verification.
    tags: [Authentication]
    security: [{ bearerAuth: [] }]
    responses:
      "202": { description: Verification email sent if the account can receive mail. }
      "401": { $ref: "../components/responses.yaml#/ErrorResponse" }

verify:
  post:
    operationId: verifyEmail
    summary: Verify an email address with a token.
    tags: [Authentication]
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { type: object, required: [token], properties: { token: { type: string } } }
    responses:
      "200": { description: Email verified. }
      "400": { $ref: "../components/responses.yaml#/ErrorResponse" }

forgotPassword:
  post:
    operationId: forgotPassword
    summary: Request password recovery.
    description: Sends a reset link for a verified email address. For an unverified pending claim, sends an email verification link first; the address must be verified before a reset link can be requested. The response stays uniform to prevent email enumeration.
    tags: [Authentication]
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { type: object, required: [email], properties: { email: { type: string, format: email } } }
    responses:
      "202": { description: A reset or verification link was sent if the email is registered. }
      "400": { $ref: "../components/responses.yaml#/ErrorResponse" }

resetPassword:
  post:
    operationId: resetPassword
    summary: Reset a password with a token.
    tags: [Authentication]
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [token, password]
            properties:
              token: { type: string }
              password: { type: string, minLength: 8, maxLength: 128 }
    responses:
      "200": { description: Password reset. }
      "400": { $ref: "../components/responses.yaml#/ErrorResponse" }

changePassword:
  post:
    operationId: changePassword
    summary: Change the authenticated user's password.
    tags: [Authentication]
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [current_password, new_password]
            properties:
              current_password: { type: string }
              new_password: { type: string, minLength: 8, maxLength: 128 }
    responses:
      "204": { description: Password changed; all sessions are revoked. }
      "400": { $ref: "../components/responses.yaml#/ErrorResponse" }
      "401": { $ref: "../components/responses.yaml#/ErrorResponse" }
      "403": { $ref: "../components/responses.yaml#/ErrorResponse" }

profile:
  get:
    operationId: getProfile
    summary: Get the authenticated user's profile and progression.
    tags: [Authentication]
    security: [{ bearerAuth: [] }]
    responses:
      "200":
        description: Profile, lifetime score, guess count, and current rank.
        content: { application/json: { schema: { $ref: "../components/schemas.yaml#/Profile" } } }
      "401": { $ref: "../components/responses.yaml#/ErrorResponse" }
  patch:
    operationId: updateProfile
    summary: Update the authenticated user's profile.
    tags: [Authentication]
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [username, avatar]
            properties:
              username: { type: string, minLength: 3, maxLength: 30 }
              email:
                type: string
                format: email
                description: >
                  Optional replacement contact claim; omission cancels a pending
                  replacement without removing the verified address.
              avatar:
                {
                  type: string,
                  enum:
                    [
                      avatar.png,
                      avatar2.png,
                      avatar3.png,
                      avatar4.png,
                      avatar5.png,
                      avatar6.png,
                      avatar7.png,
                      avatar8.png,
                      avatar9.png,
                      avatar10.png,
                    ],
                }
              current_password:
                type: string
                description: Required when password_login_enabled is true; omitted for passwordless social accounts.
    responses:
      "200":
        description: Updated profile.
        content: { application/json: { schema: { $ref: "../components/schemas.yaml#/AuthUser" } } }
      "400": { $ref: "../components/responses.yaml#/ErrorResponse" }
      "401": { $ref: "../components/responses.yaml#/ErrorResponse" }
      "403": { $ref: "../components/responses.yaml#/ErrorResponse" }
      "409": { $ref: "../components/responses.yaml#/ErrorResponse" }

uploadAvatar:
  post:
    operationId: uploadAvatar
    summary: Upload a profile photo.
    description: Accepts JPG, PNG, and WebP uploads up to 25 MiB. The web client sends the original selected file; the backend validates the image bytes, strips metadata, and resizes the result to a 256-pixel maximum dimension.
    tags: [Authentication]
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [photo]
            properties:
              photo: { type: string, format: binary }
    responses:
      "200":
        description: Updated profile with the custom avatar marker.
        content: { application/json: { schema: { $ref: "../components/schemas.yaml#/AuthUser" } } }
      "400": { $ref: "../components/responses.yaml#/ErrorResponse" }
      "401": { $ref: "../components/responses.yaml#/ErrorResponse" }
      "403": { $ref: "../components/responses.yaml#/ErrorResponse" }

deleteAccount:
  delete:
    operationId: deleteAccount
    summary: Delete the authenticated account.
    tags: [Authentication]
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              password: { type: string, description: Required for accounts with legacy password login enabled. }
              confirmation: { type: string, description: Exact username required for passwordless social accounts. }
    responses:
      "204": { description: Account deleted. }
      "401": { $ref: "../components/responses.yaml#/ErrorResponse" }
