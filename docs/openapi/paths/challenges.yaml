upload:
  post:
    operationId: uploadPhotoChallenge
    summary: Upload a photo or camera-recorded video challenge to one or more groups.
    tags: [Challenges]
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [photo, lat, long]
            properties:
              photo: { type: string, format: binary }
              group_ids:
                { type: array, items: { type: string, format: uuid }, description: Target groups (repeated form field) }
              hide_location:
                {
                  type: boolean,
                  description: Hide the exact location from guessers for the configured duration (48 hours by default),
                }
              lat: { type: number, format: double, minimum: -90, maximum: 90 }
              long: { type: number, format: double, minimum: -180, maximum: 180 }
    responses:
      "201":
        {
          description: Challenge created.,
          content: { application/json: { schema: { $ref: "../components/schemas.yaml#/ChallengeCreated" } } },
        }
      "202":
        {
          description: "Video accepted for asynchronous processing; poll the returned job at /media-processing/{id}.",
          content: { application/json: { schema: { $ref: "../components/schemas-media.yaml#/MediaProcessingJob" } } },
        }
      "400": { $ref: "../components/responses.yaml#/ErrorResponse" }
      "403": { $ref: "../components/responses.yaml#/ErrorResponse" }

accept:
  post:
    operationId: acceptChallenge
    summary: Accept a challenge and start its private view window.
    tags: [Challenges]
    security: [{ bearerAuth: [] }]
    parameters:
      - { $ref: "../components/parameters.yaml#/photoID" }
    responses:
      "200":
        {
          description: Challenge accepted.,
          content: { application/json: { schema: { $ref: "../components/schemas.yaml#/ChallengeAccepted" } } },
        }
      "403": { $ref: "../components/responses.yaml#/ErrorResponse" }
      "404": { $ref: "../components/responses.yaml#/ErrorResponse" }
      "410": { $ref: "../components/responses.yaml#/ErrorResponse" }

media:
  get:
    operationId: getChallengeMedia
    summary: Stream challenge media during an authorized window or result view.
    tags: [Challenges]
    security: [{ bearerAuth: [] }]
    parameters:
      - { $ref: "../components/parameters.yaml#/photoID" }
      - { name: result, in: query, schema: { type: string, enum: ["1"] } }
    responses:
      "200":
        description: Image or video bytes.
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
          video/mp4: { schema: { type: string, format: binary } }
          video/webm: { schema: { type: string, format: binary } }
      "403": { $ref: "../components/responses.yaml#/ErrorResponse" }
      "410": { $ref: "../components/responses.yaml#/ErrorResponse" }

mediaDelivered:
  post:
    operationId: confirmChallengeMediaDelivered
    summary: Confirm complete media delivery and start the private view window.
    tags: [Challenges]
    security: [{ bearerAuth: [] }]
    parameters:
      - { $ref: "../components/parameters.yaml#/photoID" }
    responses:
      "200":
        {
          description: Authoritative viewing deadline.,
          content: { application/json: { schema: { $ref: "../components/schemas.yaml#/ChallengeMediaDelivered" } } },
        }
      "403": { $ref: "../components/responses.yaml#/ErrorResponse" }

guess:
  post:
    operationId: submitChallengeGuess
    summary: Submit one guess after the private view window.
    tags: [Challenges]
    security: [{ bearerAuth: [] }]
    parameters:
      - { $ref: "../components/parameters.yaml#/photoID" }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [lat, long]
            properties:
              lat: { type: number, format: double, minimum: -90, maximum: 90 }
              long: { type: number, format: double, minimum: -180, maximum: 180 }
    responses:
      "201":
        {
          description: Guess recorded.,
          content: { application/json: { schema: { $ref: "../components/schemas.yaml#/GuessResponse" } } },
        }
      "200":
        {
          description: Existing guess returned idempotently.,
          content: { application/json: { schema: { $ref: "../components/schemas.yaml#/GuessResponse" } } },
        }
      "403": { $ref: "../components/responses.yaml#/ErrorResponse" }
      "409":
        {
          description: "Viewing window is still open (viewing_window_open).",
          content: { application/json: { schema: { $ref: "../components/schemas.yaml#/APIError" } } },
        }
      "410":
        {
          description: "Guess refused: the challenge expired (challenge_expired) or the guess window elapsed (guess_time_expired — the guesser did not guess in time).",
          content: { application/json: { schema: { $ref: "../components/schemas.yaml#/APIError" } } },
        }

timeout:
  post:
    operationId: timeoutChallengeGuess
    summary: Record a timeout when the guess window expires without a guess.
    tags: [Challenges]
    security: [{ bearerAuth: [] }]
    parameters:
      - { $ref: "../components/parameters.yaml#/photoID" }
    responses:
      "201":
        {
          description: Timeout recorded (score 0).,
          content: { application/json: { schema: { $ref: "../components/schemas.yaml#/GuessResponse" } } },
        }
      "200":
        {
          description: Existing guess returned idempotently.,
          content: { application/json: { schema: { $ref: "../components/schemas.yaml#/GuessResponse" } } },
        }
      "403": { $ref: "../components/responses.yaml#/ErrorResponse" }
      "404": { $ref: "../components/responses.yaml#/ErrorResponse" }
      "409":
        {
          description: "Viewing window is still open (viewing_window_open).",
          content: { application/json: { schema: { $ref: "../components/schemas.yaml#/APIError" } } },
        }
      "410": { $ref: "../components/responses.yaml#/ErrorResponse" }

results:
  get:
    operationId: getChallengeResults
    summary: Get authorized challenge results.
    tags: [Challenges]
    security: [{ bearerAuth: [] }]
    parameters:
      - { $ref: "../components/parameters.yaml#/photoID" }
    responses:
      "200":
        {
          description: Challenge results.,
          content: { application/json: { schema: { $ref: "../components/schemas.yaml#/ChallengeResults" } } },
        }
      "403": { $ref: "../components/responses.yaml#/ErrorResponse" }
      "404": { $ref: "../components/responses.yaml#/ErrorResponse" }

mediaProcessing:
  get:
    operationId: getMediaProcessingJob
    summary: Get the owner-only status of an asynchronous media-processing job.
    tags: [Media]
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: jobID, in: path, required: true, schema: { type: string, format: uuid } }
    responses:
      "200":
        {
          description: "Job status; the result is present when ready, the error_code only when failed. Storage keys and upload metadata are never exposed.",
          content: { application/json: { schema: { $ref: "../components/schemas-media.yaml#/MediaProcessingJob" } } },
        }
      "400": { $ref: "../components/responses.yaml#/ErrorResponse" }
      "404": { $ref: "../components/responses.yaml#/ErrorResponse" }
