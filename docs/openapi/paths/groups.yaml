userGroups:
  get:
    operationId: listUserGroups
    summary: List the authenticated user's groups.
    tags: [Groups]
    security: [{ bearerAuth: [] }]
    responses:
      "200":
        description: Groups.
        content: { application/json: { schema: { type: array, items: { $ref: "../components/schemas.yaml#/Group" } } } }
      "401": { $ref: "../components/responses.yaml#/ErrorResponse" }

userProfile:
  get:
    operationId: getUserProfile
    summary: Get another player's progression profile.
    description: >
      Returns a player's identity and progression. The player must share at
      least one group with the requester, or be the requester themselves;
      email and account details are never returned.
    tags: [Groups]
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: userID, in: path, required: true, schema: { type: string } }
    responses:
      "200":
        description: Player progression profile.
        content: { application/json: { schema: { $ref: "../components/schemas.yaml#/PublicProfile" } } }
      "401": { $ref: "../components/responses.yaml#/ErrorResponse" }
      "403": { $ref: "../components/responses.yaml#/ErrorResponse" }
      "404": { $ref: "../components/responses.yaml#/ErrorResponse" }

createGroup:
  post:
    operationId: createGroup
    summary: Create a group.
    tags: [Groups]
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema: { type: object, required: [name], properties: { name: { type: string, maxLength: 100 } } }
    responses:
      "201":
        description: Group created.
        content: { application/json: { schema: { $ref: "../components/schemas.yaml#/Group" } } }
      "400": { $ref: "../components/responses.yaml#/ErrorResponse" }

joinGroup:
  post:
    operationId: joinGroup
    summary: Join a group with an invite token.
    tags: [Groups]
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [invite_token]
            properties:
              invite_token: { $ref: "../components/schemas.yaml#/InviteToken" }
    responses:
      "200":
        description: Joined group.
        content: { application/json: { schema: { $ref: "../components/schemas.yaml#/Group" } } }
      "400": { $ref: "../components/responses.yaml#/ErrorResponse" }
      "404": { $ref: "../components/responses.yaml#/ErrorResponse" }
      "410": { $ref: "../components/responses.yaml#/ErrorResponse" }

groupInvites:
  get:
    operationId: listInvites
    summary: List the invites of a group for a current member.
    tags: [Groups]
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: group_id, in: query, required: true, schema: { type: string, format: uuid } }
    responses:
      "200":
        description: Invites. Never contains the bearer token.
        content:
          {
            application/json:
              { schema: { type: array, items: { $ref: "../components/schemas.yaml#/InviteListItem" } } },
          }
      "403": { $ref: "../components/responses.yaml#/ErrorResponse" }
  post:
    operationId: createInvite
    summary: Create a group invite; returns the bearer token exactly once.
    tags: [Groups]
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../components/schemas.yaml#/InviteCreateRequest" }
    responses:
      "201":
        description: Invite created.
        content: { application/json: { schema: { $ref: "../components/schemas.yaml#/InviteCreateResponse" } } }
      "403": { $ref: "../components/responses.yaml#/ErrorResponse" }
      "409": { $ref: "../components/responses.yaml#/ErrorResponse" }
      "429": { $ref: "../components/responses.yaml#/ErrorResponse" }

revokeInvite:
  delete:
    operationId: revokeInvite
    summary: Revoke a group invite immediately.
    tags: [Groups]
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: inviteID, in: path, required: true, schema: { type: string, format: uuid } }
    responses:
      "204": { description: Invite revoked. }
      "403": { $ref: "../components/responses.yaml#/ErrorResponse" }
      "404": { $ref: "../components/responses.yaml#/ErrorResponse" }

invitePreview:
  post:
    operationId: previewInvite
    summary: Preview a group from an invite token without authenticating.
    description: >
      Public endpoint. The token travels in the JSON body so it never appears
      in a URL, path, or access log. Unknown, expired, and revoked tokens all
      return the same generic 404.
    tags: [Groups]
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../components/schemas.yaml#/InvitePreviewRequest" }
    responses:
      "200":
        description: Non-sensitive group preview.
        content: { application/json: { schema: { $ref: "../components/schemas.yaml#/InvitePreview" } } }
      "400": { $ref: "../components/responses.yaml#/ErrorResponse" }
      "404": { $ref: "../components/responses.yaml#/ErrorResponse" }
      "429": { $ref: "../components/responses.yaml#/ErrorResponse" }

groupDetails:
  get:
    operationId: getGroupDetails
    summary: Get group details.
    tags: [Groups]
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: id, in: query, required: true, schema: { type: string, format: uuid } }
    responses:
      "200":
        description: Group details.
        content: { application/json: { schema: { $ref: "../components/schemas.yaml#/Group" } } }
      "403": { $ref: "../components/responses.yaml#/ErrorResponse" }

groupMembers:
  get:
    operationId: listGroupMembers
    summary: List group members.
    tags: [Groups]
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: id, in: query, required: true, schema: { type: string, format: uuid } }
    responses:
      "200":
        {
          description: Members.,
          content:
            { application/json: { schema: { type: array, items: { $ref: "../components/schemas.yaml#/Member" } } } },
        }
      "403": { $ref: "../components/responses.yaml#/ErrorResponse" }

groupPhoto:
  get:
    operationId: getGroupPhoto
    summary: Stream the private photo for a group.
    tags: [Groups]
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: group_id, in: query, required: true, schema: { type: string, format: uuid } }
    responses:
      "200": { description: "JPEG group photo bytes; Cache-Control is private, no-store." }
      "403": { $ref: "../components/responses.yaml#/ErrorResponse" }
      "404": { $ref: "../components/responses.yaml#/ErrorResponse" }
  post:
    operationId: uploadGroupPhoto
    summary: Replace the authenticated member's group photo.
    tags: [Groups]
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [group_id, photo]
            properties:
              group_id: { type: string, format: uuid }
              photo: { type: string, format: binary }
    responses:
      "200":
        description: Group photo metadata.
        content: { application/json: { schema: { $ref: "../components/schemas.yaml#/GroupPhoto" } } }
      "400": { $ref: "../components/responses.yaml#/ErrorResponse" }
      "403": { $ref: "../components/responses.yaml#/ErrorResponse" }

groupNotifications:
  get:
    operationId: getGroupNotificationPreference
    summary: Get the authenticated member's notification preference for a group.
    tags: [Groups]
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: group_id, in: query, required: true, schema: { type: string, format: uuid } }
    responses:
      "200":
        description: Notification preference.
        content: { application/json: { schema: { $ref: "../components/schemas.yaml#/GroupNotificationPreference" } } }
      "403": { $ref: "../components/responses.yaml#/ErrorResponse" }
  put:
    operationId: setGroupNotificationPreference
    summary: Enable or disable notifications for the authenticated member in a group.
    tags: [Groups]
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: group_id, in: query, required: true, schema: { type: string, format: uuid } }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../components/schemas.yaml#/GroupNotificationPreference" }
    responses:
      "200":
        description: Saved notification preference.
        content: { application/json: { schema: { $ref: "../components/schemas.yaml#/GroupNotificationPreference" } } }
      "400": { $ref: "../components/responses.yaml#/ErrorResponse" }
      "403": { $ref: "../components/responses.yaml#/ErrorResponse" }

leaderboard:
  get:
    operationId: getLeaderboard
    summary: Get the group leaderboard.
    tags: [Groups]
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: group_id, in: query, required: true, schema: { type: string, format: uuid } }
      - {
          name: period,
          in: query,
          description: "Calendar period in UTC. Omit for all time.",
          schema: { type: string, enum: [week, month, all], default: all },
        }
      - {
          name: metric,
          in: query,
          description: "Ranking metric. Omit for total.",
          schema: { type: string, enum: [total, average, elo], default: total },
        }
    responses:
      "200":
        {
          description: Leaderboard.,
          content:
            {
              application/json:
                { schema: { type: array, items: { $ref: "../components/schemas.yaml#/LeaderboardEntry" } } },
            },
        }
      "403": { $ref: "../components/responses.yaml#/ErrorResponse" }

messages:
  get:
    operationId: listGroupMessages
    summary: Get cursor-paginated group messages.
    tags: [Groups]
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: group_id, in: query, required: true, schema: { type: string, format: uuid } }
      - {
          name: cursor,
          in: query,
          description: Opaque base64 cursor from a previous next_cursor; empty selects the most recent page,
          schema: { type: string },
        }
      - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 500 } }
    responses:
      "200":
        description: Message page.
        content: { application/json: { schema: { $ref: "../components/schemas.yaml#/MessagesPage" } } }
      "403": { $ref: "../components/responses.yaml#/ErrorResponse" }

reactionUsage:
  get:
    operationId: getGroupReactionUsage
    summary: Get aggregate reaction usage for a group.
    description: Returns counts for reactions used in the group, ordered by popularity.
    tags: [Groups]
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: group_id, in: query, required: true, schema: { type: string, format: uuid } }
    responses:
      "200":
        description: Reaction usage counts.
        content:
          {
            application/json: { schema: { type: array, items: { $ref: "../components/schemas.yaml#/ReactionUsage" } } },
          }
      "400": { $ref: "../components/responses.yaml#/ErrorResponse" }
      "403": { $ref: "../components/responses.yaml#/ErrorResponse" }

messageReaction:
  put:
    operationId: setMessageReaction
    summary: Add a reaction to a group message.
    tags: [Groups]
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: messageID, in: path, required: true, schema: { type: string, format: uuid } }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../components/schemas.yaml#/MessageReactionRequest" }
    responses:
      "200":
        description: Updated message.
        content: { application/json: { schema: { $ref: "../components/schemas.yaml#/Message" } } }
      "400": { $ref: "../components/responses.yaml#/ErrorResponse" }
      "403": { $ref: "../components/responses.yaml#/ErrorResponse" }
      "404": { $ref: "../components/responses.yaml#/ErrorResponse" }
  delete:
    operationId: removeMessageReaction
    summary: Remove the authenticated user's reaction.
    tags: [Groups]
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: messageID, in: path, required: true, schema: { type: string, format: uuid } }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../components/schemas.yaml#/MessageReactionRequest" }
    responses:
      "200":
        description: Updated message.
        content: { application/json: { schema: { $ref: "../components/schemas.yaml#/Message" } } }
      "400": { $ref: "../components/responses.yaml#/ErrorResponse" }
      "403": { $ref: "../components/responses.yaml#/ErrorResponse" }
      "404": { $ref: "../components/responses.yaml#/ErrorResponse" }

messageMediaUpload:
  post:
    operationId: uploadGroupMessageMedia
    summary: Send a private image or recorded video in group chat.
    tags: [Groups]
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [group_id, media]
            properties:
              group_id: { type: string, format: uuid }
              media: { type: string, format: binary }
              content: { type: string, maxLength: 1000 }
              reply_to_id: { type: string, format: uuid }
    responses:
      "201":
        {
          description: Persisted media message,
          content: { application/json: { schema: { $ref: "../components/schemas.yaml#/Message" } } },
        }
      "202":
        {
          description: "Video accepted for asynchronous processing; poll the returned job at /media-processing/{id}.",
          content: { application/json: { schema: { $ref: "../components/schemas-media.yaml#/MediaProcessingJob" } } },
        }
      "400": { $ref: "../components/responses.yaml#/ErrorResponse" }
      "403": { $ref: "../components/responses.yaml#/ErrorResponse" }

messageMedia:
  get:
    operationId: getGroupMessageMedia
    summary: Stream a private chat attachment for a current group member.
    tags: [Groups]
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: mediaID, in: path, required: true, schema: { type: string, format: uuid } }
    responses:
      "200": { description: "Image or video bytes; Cache-Control is private, no-store." }
      "403": { $ref: "../components/responses.yaml#/ErrorResponse" }
      "404": { $ref: "../components/responses.yaml#/ErrorResponse" }
