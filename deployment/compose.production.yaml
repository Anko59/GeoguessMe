# Production: supply signed BACKEND_IMAGE/WEB_IMAGE digests, DATABASE_URL, S3_*
# and SMTP_* through the ignored production env file; see deployment/README.md.
# PostgreSQL, S3 and SMTP are external unless their staging-only local-* profile
# is explicitly enabled. Hosted R2 is unchanged by the local S3 fixture.
# Services drop capabilities, deny escalation and bound PIDs; state uses explicit
# volumes/tmpfs and isolated tiers. Only documented per-image capabilities return.
# Before production changes, run restart-rehearsal, prod-container-verify and
# smoke rehearsals; canonical hardening and recovery details: docs/operations.md.

name: ${COMPOSE_PROJECT_NAME:-geoguessme-prod}

services:
  migration:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set to an immutable tag}
    command: ["migrate", "up"]
    env_file:
      - path: ${GEOGUESSME_ENV_FILE:-deployment/env/production.env}
        required: false
    restart: "no"
    read_only: true
    tmpfs: ["/tmp"]
    user: "65532:65532"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    networks: [app]
    depends_on:
      db:
        condition: service_healthy
        required: false

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set to an immutable tag}
    command: ["serve"]
    env_file:
      - path: ${GEOGUESSME_ENV_FILE:-deployment/env/production.env}
        required: false
    read_only: true
    tmpfs: ["/tmp"]
    user: "65532:65532"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: ${GEOGUESSME_BACKEND_PIDS:-256}
    networks: [frontend, app]
    restart: unless-stopped
    depends_on:
      migration: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "/usr/local/bin/geoguessme", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Server plus one transcode: child rlimits are 1 CPU/512 MiB/128 PIDs/60s.
    # Quarantine and transcode scratch live on /tmp, not the read-only root.
    deploy:
      resources:
        limits:
          cpus: ${GEOGUESSME_BACKEND_CPUS:-2.0}
          memory: ${GEOGUESSME_BACKEND_MEMORY:-1G}
          pids: ${GEOGUESSME_BACKEND_PIDS:-256}

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy@sha256:b1b2021fe8f4004573e8d690dec6c7bb29cc44364572cf8510a05bf3a0ae2ded
    profiles: [social]
    command: ["--config=/etc/oauth2-proxy/oauth2-proxy.cfg", "--alpha-config=/etc/oauth2-proxy/oauth2-proxy-alpha.yaml"]
    env_file:
      - path: ${GEOGUESSME_ENV_FILE:-deployment/env/production.env}
        required: false
    volumes:
      - ./deployment/oauth2-proxy/oauth2-proxy.cfg:/etc/oauth2-proxy/oauth2-proxy.cfg:ro
      - ./deployment/oauth2-proxy/oauth2-proxy-alpha.yaml:/etc/oauth2-proxy/oauth2-proxy-alpha.yaml:ro
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid,nodev"]
    user: "65532:65532"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    networks: [frontend]
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/bin/oauth2-proxy", "--version"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: ${GEOGUESSME_OAUTH2_PROXY_CPUS:-0.25}
          memory: ${GEOGUESSME_OAUTH2_PROXY_MEMORY:-128M}
          pids: 128

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE must be set to an immutable tag}
    ports: ["127.0.0.1:${GEOGUESSME_WEB_PORT:-8081}:80"]
    read_only: true
    tmpfs:
      - "/data:uid=1000,gid=1000,mode=0755"
      - "/config:uid=1000,gid=1000,mode=0755"
    user: "1000:1000"
    cap_drop: ["ALL"]
    # UID 1000 needs only NET_BIND_SERVICE for :80.
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    networks: [frontend]
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: ${GEOGUESSME_WEB_CPUS:-0.5}
          memory: ${GEOGUESSME_WEB_MEMORY:-256M}
          pids: 128

  # --- Optional local services for staging/restore exercises ---------------
  db:
    image: ${POSTGRES_IMAGE:?Run through Make or supply the audited immutable PostgreSQL image}
    profiles: [local-db]
    env_file:
      - path: ${GEOGUESSME_ENV_FILE:-deployment/env/production.env}
        required: false
    volumes: ["geoguessme_prod_db:/var/lib/postgresql/data"]
    read_only: true
    tmpfs: ["/tmp", "/var/run/postgresql"]
    # Leave user unset: entrypoint starts root, owns data/socket, then drops UID.
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30

  # S3-compatible local fixture. The internal DNS name is retained for clients;
  # SeaweedFS data MUST NOT reuse the retired MinIO volume format.
  minio:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d # SeaweedFS 4.48
    profiles: [local-minio]
    user: "1000:1000"
    command:
      [
        server,
        -s3,
        -dir=/data,
        -ip=minio,
        -ip.bind=0.0.0.0,
        -s3.port=9000,
        -s3.config=/etc/seaweedfs/s3.json,
        "-volume.max=${GEOGUESSME_S3_FIXTURE_VOLUME_MAX:-32}",
        -master.volumeSizeLimitMB=64,
      ]
    volumes:
      - geoguessme_prod_s3_fixture:/data
      - ${GEOGUESSME_S3_FIXTURE_CONFIG:-./deployment/s3-fixture/credentials.json}:/etc/seaweedfs/s3.json:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    tmpfs: [/tmp]
    networks: [app]
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "--max-time",
          "2",
          "--aws-sigv4",
          "aws:amz:us-east-1:s3",
          "--user",
          "minioadmin:minioadmin",
          "http://127.0.0.1:9000/",
        ]
      interval: 3s
      timeout: 3s
      retries: 30

  smtp:
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48 # Mailpit 1.31.4
    profiles: [local-smtp]
    ports: ["${GEOGUESSME_PROD_VERIFY_SMTP_PORT:-8025}:8025"]
    # Staging-only, in-memory mail; scratch /tmp, unprivileged SMTP1025/UI8025.
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    tmpfs: ["/tmp"]
    networks: [app]

networks:
  # Public-facing tier: only the Caddy gateway and the backend it proxies to.
  frontend: {}
  # Application tier: backend, migration, and the data services they reach.
  # Data services (postgres, minio, smtp) are not reachable from the gateway.
  app: {}

volumes:
  geoguessme_prod_db:
  geoguessme_prod_s3_fixture:
