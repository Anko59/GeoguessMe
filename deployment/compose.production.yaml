# Production stack. Images are referenced by immutable tags supplied through the
# environment; there is no implicit "latest" so deploys are reproducible.
# PostgreSQL, SMTP, and S3 are external by default. Optional local-service
# profiles (local-db, local-minio, local-smtp) exist only for staging/restore
# exercises and are not enabled by a normal deploy.
#
# Required environment:
#   BACKEND_IMAGE   e.g. ghcr.io/org/geoguessme-backend:1.2.3
#   WEB_IMAGE       e.g. ghcr.io/org/geoguessme-web:1.2.3
#   DATABASE_URL    external Postgres (sslmode=require)
#   S3_*            external private S3-compatible bucket
#   SMTP_*          external authenticated SMTP (starttls or tls)
# Provide secrets via deployment/env/production.env (git-ignored).
#
# Runtime hardening: every service drops all Linux capabilities, disables
# privilege escalation (no-new-privileges), and runs under a per-service
# process (PID) limit. Filesystems are read-only where the service supports it;
# writable state lives in explicit volumes and tmpfs mounts. Services are
# segmented onto named networks so the public gateway (web) can reach only the
# backend, and data services are reachable only from the application tier.
# Per-service cap_add entries document the minimal capability each image needs
# (e.g. Caddy needs NET_BIND_SERVICE to bind the unprivileged-owner :80 port;
# PostgreSQL needs the standard ownership/drop-privilege set for its data
# directory). These directives require a compatibility rehearsal before
# production apply: make restart-rehearsal, make prod-container-verify, and
# the smoke rehearsals. Apply to production only after a rehearsal proves
# compatibility (the plan requires: where rehearsals prove compatibility).

name: ${COMPOSE_PROJECT_NAME:-geoguessme-prod}

services:
  migration:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set to an immutable tag}
    command: ["migrate", "up"]
    env_file:
      - path: ${GEOGUESSME_ENV_FILE:-deployment/env/production.env}
        required: false
    restart: "no"
    read_only: true
    tmpfs: ["/tmp"]
    user: "65532:65532"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    networks: [app]
    depends_on:
      db:
        condition: service_healthy
        required: false

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set to an immutable tag}
    command: ["serve"]
    env_file:
      - path: ${GEOGUESSME_ENV_FILE:-deployment/env/production.env}
        required: false
    read_only: true
    tmpfs: ["/tmp"]
    user: "65532:65532"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: ${GEOGUESSME_BACKEND_PIDS:-256}
    networks: [frontend, app]
    restart: unless-stopped
    depends_on:
      migration: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "/usr/local/bin/geoguessme", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    # The in-process media-processing worker bounds each ffprobe/ffmpeg child to
    # 1 CPU / 512 MiB / 128 PIDs / 60s via rlimits (see mediaprocessing). This
    # container hosts the Go server plus one bounded transcode, so the ceiling
    # sits above the per-job backstop. Worker temp files (quarantine download +
    # transcode output) live on the /tmp tmpfs above the read-only root.
    deploy:
      resources:
        limits:
          cpus: ${GEOGUESSME_BACKEND_CPUS:-2.0}
          memory: ${GEOGUESSME_BACKEND_MEMORY:-1G}
          pids: ${GEOGUESSME_BACKEND_PIDS:-256}

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy@sha256:b1b2021fe8f4004573e8d690dec6c7bb29cc44364572cf8510a05bf3a0ae2ded
    profiles: [social]
    command: ["--config=/etc/oauth2-proxy/oauth2-proxy.cfg", "--alpha-config=/etc/oauth2-proxy/oauth2-proxy-alpha.yaml"]
    env_file:
      - path: ${GEOGUESSME_ENV_FILE:-deployment/env/production.env}
        required: false
    volumes:
      - ./deployment/oauth2-proxy/oauth2-proxy.cfg:/etc/oauth2-proxy/oauth2-proxy.cfg:ro
      - ./deployment/oauth2-proxy/oauth2-proxy-alpha.yaml:/etc/oauth2-proxy/oauth2-proxy-alpha.yaml:ro
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid,nodev"]
    user: "65532:65532"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    networks: [frontend]
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/bin/oauth2-proxy", "--version"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: ${GEOGUESSME_OAUTH2_PROXY_CPUS:-0.25}
          memory: ${GEOGUESSME_OAUTH2_PROXY_MEMORY:-128M}
          pids: 128

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE must be set to an immutable tag}
    ports: ["127.0.0.1:${GEOGUESSME_WEB_PORT:-8081}:80"]
    read_only: true
    tmpfs:
      - "/data:uid=1000,gid=1000,mode=0755"
      - "/config:uid=1000,gid=1000,mode=0755"
    user: "1000:1000"
    cap_drop: ["ALL"]
    # Caddy runs as UID 1000 and listens on :80, which is below the
    # unprivileged-port boundary; NET_BIND_SERVICE is the minimal capability
    # required for that bind after dropping the Docker default set.
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    networks: [frontend]
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: ${GEOGUESSME_WEB_CPUS:-0.5}
          memory: ${GEOGUESSME_WEB_MEMORY:-256M}
          pids: 128

  # --- Optional local services for staging/restore exercises ---------------
  db:
    image: postgres:15-alpine@sha256:a2c20749c564b4eb73a77bfda626f8a3cde1bbfae020fb97c616a00cdc1a2181 # PostgreSQL 15.19
    profiles: [local-db]
    env_file:
      - path: ${GEOGUESSME_ENV_FILE:-deployment/env/production.env}
        required: false
    volumes: ["geoguessme_prod_db:/var/lib/postgresql/data"]
    read_only: true
    tmpfs: ["/tmp", "/var/run/postgresql"]
    # The official entrypoint runs as root and drops to postgres: it must chown
    # and re-stat the data directory and create the Unix socket, so keep the
    # minimal ownership/drop-privilege capabilities. Do NOT set user here; the
    # image manages its own uid/gid and the entrypoint requires root to chown.
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e # MinIO release
    profiles: [local-minio]
    command: server /data --console-address ":9001"
    env_file:
      - path: env/production.env
        required: false
    volumes: ["geoguessme_prod_minio:/data"]
    # Staging-only fixture. Data lives in the /data volume and MinIO keeps
    # configuration under its home, so the root filesystem stays writable;
    # capabilities, privilege escalation, process count, and network placement
    # are still hardened. Read-only would require a writable tmpfs for the
    # config home and is not needed for a disposable rehearsal fixture.
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    tmpfs: ["/tmp"]
    networks: [app]

  smtp:
    image: axllent/mailpit:v1.30.7@sha256:d5ecbb067db3705fa953d79e1b7f81ef84038df67aba6c52825d8c02a1ea748a # Mailpit 1.30.7
    profiles: [local-smtp]
    ports: ["${GEOGUESSME_PROD_VERIFY_SMTP_PORT:-8025}:8025"]
    # Staging-only fixture; Mailpit keeps messages in memory. Capabilities,
    # privilege escalation, and process count are hardened; /tmp is writable
    # scratch. The SMTP listener (1025) and web UI (8025) are unprivileged.
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    tmpfs: ["/tmp"]
    networks: [app]

networks:
  # Public-facing tier: only the Caddy gateway and the backend it proxies to.
  frontend: {}
  # Application tier: backend, migration, and the data services they reach.
  # Data services (postgres, minio, smtp) are not reachable from the gateway.
  app: {}

volumes:
  geoguessme_prod_db:
  geoguessme_prod_minio:
