# Explicit local development migration target. The retired MinIO volume is never
# mounted here. This mounts the SAME new volume as the normal development stack.
services:
  target:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    user: "1000:1000"
    command:
      [
        server,
        -s3,
        -dir=/data,
        -ip=target,
        -ip.bind=0.0.0.0,
        -s3.port=9000,
        -s3.config=/etc/seaweedfs/s3.json,
        "-volume.max=${GEOGUESSME_S3_FIXTURE_VOLUME_MAX:-32}",
        -master.volumeSizeLimitMB=64,
      ]
    ports: ["127.0.0.1:19000:9000"]
    volumes:
      - target-data:/data
      - ./deployment/s3-fixture/credentials.json:/etc/seaweedfs/s3.json:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    tmpfs: [/tmp]
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "--max-time",
          "2",
          "--aws-sigv4",
          "aws:amz:us-east-1:s3",
          "--user",
          "minioadmin:minioadmin",
          "http://127.0.0.1:9000/",
        ]
      interval: 3s
      timeout: 3s
      retries: 40
volumes:
  target-data:
    name: geoguessme-dev_geoguessme_dev_s3_fixture
