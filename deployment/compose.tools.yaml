# Docker-only development and verification toolchain.
#
# Human-readable versions are next to immutable image digests. Tool services
# have no application volumes, production env files, or Docker socket access.
name: ${GEOGUESSME_TOOLS_PROJECT:?Run tooling through Make}

x-workspace: &workspace ./:/workspace:ro

x-host-tools: &host-tools
  working_dir: /workspace
  stdin_open: true
  tty: false
  security_opt:
    - no-new-privileges:true
  extra_hosts:
    - host.docker.internal:host-gateway

services:
  mobile-tools:
    <<: *host-tools
    build:
      context: .
      dockerfile: deployment/docker/tools/mobile-tools.Dockerfile
    image: geoguessme/mobile-tools:android-36-maestro-2.10.0
    network_mode: host
    environment:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      GRADLE_USER_HOME: /root/.gradle
    volumes:
      - ./:/workspace
      - ./.local/mobile/android-sdk:/opt/android-sdk
      - ./.local/mobile/android-home:/root/.android
      - ./.local/mobile/gradle:/root/.gradle
      - frontend-node-modules:/workspace/frontend/node_modules
    tmpfs:
      - /emulator-data:size=8g,mode=1777

  mobile-tools-kvm:
    extends: mobile-tools
    image: geoguessme/mobile-tools:android-36-maestro-2.10.0
    devices:
      - /dev/kvm:/dev/kvm

  # Opt-in Linux USB access, without privileged mode or access to host adb.
  mobile-device-tools:
    extends: mobile-tools
    profiles: [mobile-device]
    network_mode: none
    devices:
      - /dev/bus/usb:/dev/bus/usb

  go-tools:
    <<: *host-tools
    build:
      context: .
      dockerfile: deployment/docker/tools/go-tools.Dockerfile
    image: geoguessme/go-tools:1.26.6
    volumes:
      - *workspace
      - ${GEOGUESSME_GIT_COMMON_DIR:?GEOGUESSME_GIT_COMMON_DIR must be exported by make}:${GEOGUESSME_GIT_COMMON_DIR:?GEOGUESSME_GIT_COMMON_DIR must be exported by make}:ro
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build

  s3-fixture-client:
    extends: go-tools
    profiles: [s3-fixture]
    networks: [s3-fixture]

  # Explicit local migration client; Linux host networking reaches loopback-only
  # source/staging endpoints. It never receives live R2 configuration.
  s3-fixture-host-client:
    extends: go-tools
    profiles: [s3-fixture]
    network_mode: host

  supply-chain-verifier:
    <<: *host-tools
    profiles: [s3-fixture]
    image: ghcr.io/sigstore/cosign/cosign:v2.6.5@sha256:ad281047f85c5e1fc6ffbc30c2b55be3b07b4032bef715a12122ce5829619aca
    environment:
      HOME: /tmp
      XDG_CACHE_HOME: /tmp
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    pids_limit: 128

  go-tools-write:
    <<: *host-tools
    build:
      context: .
      dockerfile: deployment/docker/tools/go-tools.Dockerfile
    image: geoguessme/go-tools:1.26.6
    volumes:
      - ./:/workspace
      - ${GEOGUESSME_GIT_COMMON_DIR:?GEOGUESSME_GIT_COMMON_DIR must be exported by make}:${GEOGUESSME_GIT_COMMON_DIR:?GEOGUESSME_GIT_COMMON_DIR must be exported by make}:ro
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build

  node-tools:
    <<: *host-tools
    build:
      context: .
      dockerfile: deployment/docker/tools/node-tools.Dockerfile
      args:
        TOOLS_UID: ${TOOLS_UID:-1000}
        TOOLS_GID: ${TOOLS_GID:-1000}
    image: geoguessme/node-tools:22.23.2
    environment:
      PATH: /workspace/frontend/node_modules/.bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - *workspace
      - ${GEOGUESSME_GIT_COMMON_DIR:?GEOGUESSME_GIT_COMMON_DIR must be exported by make}:${GEOGUESSME_GIT_COMMON_DIR:?GEOGUESSME_GIT_COMMON_DIR must be exported by make}:ro
      - frontend-node-modules:/workspace/frontend/node_modules
      - npm-cache:/npm-cache

  node-tools-write:
    <<: *host-tools
    build:
      context: .
      dockerfile: deployment/docker/tools/node-tools.Dockerfile
      args:
        TOOLS_UID: ${TOOLS_UID:-1000}
        TOOLS_GID: ${TOOLS_GID:-1000}
    image: geoguessme/node-tools:22.23.2
    environment:
      PATH: /workspace/frontend/node_modules/.bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - ./:/workspace
      - ${GEOGUESSME_GIT_COMMON_DIR:?GEOGUESSME_GIT_COMMON_DIR must be exported by make}:${GEOGUESSME_GIT_COMMON_DIR:?GEOGUESSME_GIT_COMMON_DIR must be exported by make}:ro
      - frontend-node-modules:/workspace/frontend/node_modules
      - npm-cache:/npm-cache

  # Playwright 1.63.0 with browser binaries and OS dependencies preinstalled.
  # Browsers are baked into the pinned image; no cache volume is needed.
  playwright:
    <<: *host-tools
    image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    environment:
      PATH: /workspace/frontend/node_modules/.bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - *workspace
      - frontend-node-modules:/workspace/frontend/node_modules
      - npm-cache:/root/.npm

  # ShellCheck 0.10.0 (linux/amd64 digest: 2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb)
  shellcheck:
    <<: *host-tools
    image: koalaman/shellcheck:v0.10.0@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb
    entrypoint: []
    volumes:
      - *workspace

  # shfmt 3.12.0 (linux/amd64 digest: 307d265ffd25ce832899ae17c93ed5062fc3375c514bba8f52cbf52792735c4d)
  shfmt:
    <<: *host-tools
    image: mvdan/shfmt:v3.12.0@sha256:307d265ffd25ce832899ae17c93ed5062fc3375c514bba8f52cbf52792735c4d
    entrypoint: []
    volumes:
      - *workspace
      - ${GEOGUESSME_GIT_COMMON_DIR:?GEOGUESSME_GIT_COMMON_DIR must be exported by make}:${GEOGUESSME_GIT_COMMON_DIR:?GEOGUESSME_GIT_COMMON_DIR must be exported by make}:ro

  shfmt-write:
    <<: *host-tools
    image: mvdan/shfmt:v3.12.0@sha256:307d265ffd25ce832899ae17c93ed5062fc3375c514bba8f52cbf52792735c4d
    entrypoint: []
    volumes:
      - ./:/workspace
      - ${GEOGUESSME_GIT_COMMON_DIR:?GEOGUESSME_GIT_COMMON_DIR must be exported by make}:${GEOGUESSME_GIT_COMMON_DIR:?GEOGUESSME_GIT_COMMON_DIR must be exported by make}:ro

  # Hadolint 2.12.0 (linux/amd64 digest: 3c206a451cec6d486367e758645269fd7d696c5ccb6ff59d8b03b0e45268a199)
  hadolint:
    <<: *host-tools
    image: hadolint/hadolint:v2.12.0-alpine@sha256:3c206a451cec6d486367e758645269fd7d696c5ccb6ff59d8b03b0e45268a199
    entrypoint: []
    volumes:
      - *workspace

  # actionlint 1.7.7 (linux/amd64 digest: 887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9)
  actionlint:
    <<: *host-tools
    image: rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
    entrypoint: []
    volumes:
      - *workspace
      - ${GEOGUESSME_GIT_COMMON_DIR:?GEOGUESSME_GIT_COMMON_DIR must be exported by make}:${GEOGUESSME_GIT_COMMON_DIR:?GEOGUESSME_GIT_COMMON_DIR must be exported by make}:ro

  # SQLFluff 3.4.1 (linux/amd64 digest: 7e70b3d1dd5aa071712699001dabf912abc0137b0aae96fc1db0d559a68818e0)
  sqlfluff:
    <<: *host-tools
    image: sqlfluff/sqlfluff:3.4.1@sha256:7e70b3d1dd5aa071712699001dabf912abc0137b0aae96fc1db0d559a68818e0
    entrypoint: []
    volumes:
      - *workspace

  sqlfluff-write:
    <<: *host-tools
    image: sqlfluff/sqlfluff:3.4.1@sha256:7e70b3d1dd5aa071712699001dabf912abc0137b0aae96fc1db0d559a68818e0
    entrypoint: []
    volumes:
      - ./:/workspace

  # Validation reuses the exact Caddy runtime consumed by the frontend build.
  caddy:
    <<: *host-tools
    image: ${CADDY_RUNTIME_IMAGE:?Run through Make or supply a verified Caddy runtime}
    entrypoint: []
    volumes:
      - *workspace

  # Cloudflared 2026.9.3 with Debian OpenSSL deb13u3; AMD64 is explicit.
  cloudflared:
    <<: *host-tools
    platform: linux/amd64
    image: ${CLOUDFLARED_IMAGE:?Run through Make or supply the immutable Cloudflared artifact}
    environment:
      - TUNNEL_SERVICE_TOKEN_ID
      - TUNNEL_SERVICE_TOKEN_SECRET
    volumes: []

  # Terraform 1.16.5 official binary with only the PCRE2 package refreshed.
  # provider credentials are passed explicitly and never baked into this image
  # or Compose configuration.
  terraform:
    <<: *host-tools
    build:
      context: .
      dockerfile: deployment/docker/terraform-tools.Dockerfile
    image: geoguessme/terraform-tools:1.16.5-pcre2-10.49-r0
    entrypoint: []
    working_dir: /workspace/infra/terraform
    environment:
      - HCLOUD_TOKEN
      - CLOUDFLARE_API_TOKEN
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - TF_DATA_DIR=/workspace/infra/terraform/.terraform
      - TF_PLUGIN_CACHE_DIR=/tf-plugin-cache
    volumes:
      - ./:/workspace
      - ./.tools-cache/terraform-plugins:/tf-plugin-cache

  # Restic 0.19.1 with the reviewed fixed module graph. Hosted backup/restore
  # scripts receive this image as an exact signed registry reference.
  restic:
    <<: *host-tools
    image: ${RESTIC_IMAGE:?Run through Make or supply the immutable Restic artifact}
    entrypoint: []
    volumes:
      - *workspace

  # PostgreSQL 15.19 with the OpenSSL and libuuid packages refreshed to fixed
  # releases (CVE-2026-14456 and CVE-2026-53612 family); scanned by
  # `make audit-images` in place of the upstream base.
  postgres-openssl:
    <<: *host-tools
    image: ${POSTGRES_IMAGE:?Run through Make or supply the immutable PostgreSQL artifact}
    entrypoint: []
    volumes:
      - *workspace

  # SOPS v3.13.3 with Debian libexpat pinned to the fixed deb12u4 release.
  # The upstream image remains only the digest-pinned build input; scan and use
  # this patched final image instead.
  sops:
    <<: *host-tools
    image: ${SOPS_IMAGE:?Run through Make or supply the immutable SOPS artifact}
    entrypoint: []
    volumes:
      - ./:/workspace

  # Local equivalent of the signed runtime socket-proxy derivative. CI replaces
  # the default audit reference with the exact published digest.
  socket-proxy-tools:
    <<: *host-tools
    image: ${SOCKET_PROXY_IMAGE:?Run through Make or supply the immutable socket-proxy artifact}
    entrypoint: []
    volumes:
      - *workspace

  # k6 0.55.0 (linux/amd64 digest: b24f418fc99a26dd57904c952c03bfaf79462be18508acc45aafa07ff68e7df2)
  loadtest:
    <<: *host-tools
    image: grafana/k6:0.55.0@sha256:b24f418fc99a26dd57904c952c03bfaf79462be18508acc45aafa07ff68e7df2
    entrypoint: []
    volumes:
      - *workspace

  # Heavy security/ops image: govulncheck, race detector (CGO), psql, pg_dump.
  # Used only when vulnerability auditing, race testing, or database operations
  # are needed. Normal format/lint/test/build targets use the smaller go-tools.
  go-security:
    <<: *host-tools
    build:
      context: .
      dockerfile: deployment/docker/tools/go-security.Dockerfile
    image: geoguessme/go-security:1.26.6
    volumes:
      - *workspace
      - ${GEOGUESSME_GIT_COMMON_DIR:?GEOGUESSME_GIT_COMMON_DIR must be exported by make}:${GEOGUESSME_GIT_COMMON_DIR:?GEOGUESSME_GIT_COMMON_DIR must be exported by make}:ro
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build

  go-security-write:
    <<: *host-tools
    image: geoguessme/go-security:1.26.6
    volumes:
      - ./:/workspace
      - ${GEOGUESSME_GIT_COMMON_DIR:?GEOGUESSME_GIT_COMMON_DIR must be exported by make}:${GEOGUESSME_GIT_COMMON_DIR:?GEOGUESSME_GIT_COMMON_DIR must be exported by make}:ro
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build

  # Trivy 0.73.0 (multi-arch index digest); final-image vulnerability scanner
  # for `make audit-images`. Images are exported by the host with `docker save`
  # and scanned from tarballs (--input), so this service never needs the Docker
  # socket. The trivy DB and reports live under the gitignored
  # security/image-reports/ directory.
  trivy:
    <<: *host-tools
    image: aquasec/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c
    entrypoint: []
    environment:
      TRIVY_CACHE_DIR: /tmp/trivy-cache
    volumes:
      # Only audit artifacts: never mount checkout Git credentials or local dotenvs.
      - ./security/image-reports:/workspace/security/image-reports
      - ./security/image-reports/.trivy-cache:/tmp/trivy-cache

networks:
  s3-fixture:
    external: true
    name: ${GEOGUESSME_S3_FIXTURE_NETWORK:?Run the fixture client through Make}

volumes:
  go-mod-cache:
  go-build-cache:
  frontend-node-modules:
  npm-cache:
