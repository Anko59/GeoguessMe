# Development stack: PostgreSQL 15, MinIO, Mailpit, backend hot reload (Air),
# and Vite hot reload. Replaces the old root docker-compose.yml.
name: geoguessme-dev

services:
  db:
    image: ${POSTGRES_IMAGE:?Run through Make or supply the audited immutable PostgreSQL image}
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: geoguessme
    ports: ["5432:5432"]
    volumes: ["geoguessme_dev_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d geoguessme"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible local fixture. The internal DNS name is retained for clients;
  # SeaweedFS data MUST NOT reuse the retired MinIO volume format.
  minio:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d # SeaweedFS 4.48
    user: "1000:1000"
    command:
      [
        server,
        -s3,
        -dir=/data,
        -ip=minio,
        -ip.bind=0.0.0.0,
        -s3.port=9000,
        -s3.config=/etc/seaweedfs/s3.json,
        "-volume.max=${GEOGUESSME_S3_FIXTURE_VOLUME_MAX:-32}",
        -master.volumeSizeLimitMB=64,
      ]
    volumes:
      - geoguessme_dev_s3_fixture:/data
      - ./deployment/s3-fixture/credentials.json:/etc/seaweedfs/s3.json:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    tmpfs: [/tmp]
    ports: ["127.0.0.1:9000:9000"]
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "--max-time",
          "2",
          "--aws-sigv4",
          "aws:amz:us-east-1:s3",
          "--user",
          "minioadmin:minioadmin",
          "http://127.0.0.1:9000/",
        ]
      interval: 3s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48 # Mailpit 1.31.4
    ports: ["1025:1025", "8025:8025"]

  backend:
    build:
      context: .
      dockerfile: deployment/docker/backend.dev.Dockerfile
    command: ["sh", "-c", "go run . migrate up && air"]
    ports: ["127.0.0.1:8080:8080"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://user:password@db:5432/geoguessme?sslmode=disable
      JWT_SECRET: dev_secret_key_change_me_please_32_characters
      PUBLIC_URL: ${GEOGUESSME_DEV_PUBLIC_URL:-http://localhost:5173}
      ALLOWED_ORIGINS: ${GEOGUESSME_DEV_PUBLIC_URL:-http://localhost:5173}
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER_URL: https://auth-dev.geoguessme.com/realms/geoguessme
      OIDC_CLIENT_ID: geoguessme-dev
      OIDC_CLIENT_SECRET: local-geoguessme-client-secret
      OIDC_SOCIAL_PROVIDERS: ${GEOGUESSME_OIDC_SOCIAL_PROVIDERS:-}
      SSL_CERT_DIR: /etc/ssl/certs:/run/local-ca
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: geoguessme-media
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_USE_PATH_STYLE: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: no-reply@localhost
      SMTP_TLS: "off"
      MEDIA_PROCESSING_WORKER: "true"
    depends_on:
      db: { condition: service_healthy }
      minio: { condition: service_healthy }
      mailpit: { condition: service_started }
    volumes:
      - ./backend:/app/backend
      - ./.local/caddy:/run/local-ca:ro
    extra_hosts:
      - "auth-dev.geoguessme.com:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: .
      dockerfile: deployment/docker/frontend.dev.Dockerfile
    ports: ["5173:5173"]
    command: ["sh", "-c", "npm install --prefer-offline --no-audit && npm run dev -- --host"]
    volumes:
      - "./frontend:/app/frontend"
      - "frontend-node-modules:/app/frontend/node_modules"
    environment: { CHOKIDAR_USEPOLLING: "true" }
    depends_on:
      backend: { condition: service_healthy }

  # Optional, fully local social-auth path. `make dev-social` starts these
  # services before the application so backend OIDC discovery is deterministic.
  # External provider credentials can be supplied through the matching shell
  # variables. Native Keycloak email signup/login works without those credentials.
  local-keycloak-db:
    image: ${IDENTITY_POSTGRES_IMAGE:-${POSTGRES_IMAGE:?Supply the audited immutable PostgreSQL image}}
    profiles: [social]
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: local-keycloak-password
      POSTGRES_DB: keycloak
    volumes: ["geoguessme_dev_keycloak_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 30

  local-keycloak:
    image: ${KEYCLOAK_IMAGE:-${LOCAL_KEYCLOAK_IMAGE:?Run through Make or set KEYCLOAK_IMAGE}}
    profiles: [social]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: local-keycloak-db
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: local-keycloak-password
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-admin-password
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8083"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      # Keep the optional identity stack viable in a 2 GiB local Docker VM
      # alongside the application and a Playwright browser.
      JAVA_OPTS_KC_HEAP: -Xms48m -Xmx160m
      KC_HOSTNAME: https://auth-dev.geoguessme.com
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_TRANSACTION_XA_ENABLED: "false"
      GEOGUESSME_WEBAUTHN_RP_ID: auth-dev.geoguessme.com
      GEOGUESSME_PRODUCTION_OIDC_CLIENT_SECRET: unused-local-production-secret
      GEOGUESSME_PRODUCTION_REDIRECT_URL: https://geoguessme.com/oauth2/callback
      GEOGUESSME_PRODUCTION_ORIGIN: https://geoguessme.com
      GEOGUESSME_PRODUCTION_POST_LOGOUT_URLS: https://geoguessme.com/*
      GEOGUESSME_DEV_OIDC_CLIENT_SECRET: local-geoguessme-client-secret
      GEOGUESSME_DEV_REDIRECT_URL: https://geoguessme.localhost/oauth2/callback
      GEOGUESSME_DEV_ORIGIN: https://geoguessme.localhost
      GEOGUESSME_DEV_POST_LOGOUT_URLS: https://geoguessme.localhost/*
      GEOGUESSME_GOOGLE_CLIENT_ID: ${GEOGUESSME_GOOGLE_CLIENT_ID:-local-google-placeholder}
      GEOGUESSME_GOOGLE_CLIENT_SECRET: ${GEOGUESSME_GOOGLE_CLIENT_SECRET:-local-google-placeholder}
      GEOGUESSME_GITHUB_CLIENT_ID: ${GEOGUESSME_GITHUB_CLIENT_ID:-local-github-placeholder}
      GEOGUESSME_GITHUB_CLIENT_SECRET: ${GEOGUESSME_GITHUB_CLIENT_SECRET:-local-github-placeholder}
      GEOGUESSME_APPLE_CLIENT_ID: ${GEOGUESSME_APPLE_CLIENT_ID:-local-apple-placeholder}
      GEOGUESSME_APPLE_CLIENT_SECRET: ${GEOGUESSME_APPLE_CLIENT_SECRET:-local-apple-placeholder}
      GEOGUESSME_KEYCLOAK_SMTP_HOST: mailpit
      GEOGUESSME_KEYCLOAK_SMTP_PORT: "1025"
      GEOGUESSME_KEYCLOAK_SMTP_FROM: no-reply@geoguessme.localhost
      GEOGUESSME_KEYCLOAK_SMTP_AUTH: "false"
      GEOGUESSME_KEYCLOAK_SMTP_STARTTLS: "false"
      GEOGUESSME_KEYCLOAK_SMTP_SSL: "false"
      GEOGUESSME_KEYCLOAK_SMTP_USER: ""
      GEOGUESSME_KEYCLOAK_SMTP_PASSWORD: ""
      GEOGUESSME_KEYCLOAK_SSL_REQUIRED: external
    volumes:
      - ./deployment/keycloak/realm-geoguessme.json:/opt/keycloak/data/import/realm-geoguessme.json:ro
      # Keep these sibling mounts separate. A parent /themes bind masks the
      # nested public-assets bind on Docker Desktop, leaving the logo and map
      # background as live 404s even though both mounts appear in inspect.
      - ./deployment/keycloak/themes/geoguessme/login/theme.properties:/opt/keycloak/themes/geoguessme/login/theme.properties:ro
      - ./deployment/keycloak/themes/geoguessme/login/messages:/opt/keycloak/themes/geoguessme/login/messages:ro
      - ./deployment/keycloak/themes/geoguessme/login/resources/css:/opt/keycloak/themes/geoguessme/login/resources/css:ro
      - ./frontend/public:/opt/keycloak/themes/geoguessme/login/resources/app:ro
    depends_on:
      local-keycloak-db: { condition: service_healthy }
      mailpit: { condition: service_started }
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '200' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  local-keycloak-config:
    image: ${KEYCLOAK_IMAGE:-${LOCAL_KEYCLOAK_IMAGE:?Run through Make or set KEYCLOAK_IMAGE}}
    profiles: [social-config]
    entrypoint: ["/opt/geoguessme/keycloak/apply-realm-config.sh"]
    environment:
      KEYCLOAK_CONFIG_SERVER: http://local-keycloak:8083
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-admin-password
      GEOGUESSME_KEYCLOAK_SMTP_HOST: mailpit
      GEOGUESSME_KEYCLOAK_SMTP_PORT: "1025"
      GEOGUESSME_KEYCLOAK_SMTP_FROM: no-reply@geoguessme.localhost
      GEOGUESSME_KEYCLOAK_SMTP_AUTH: "false"
      GEOGUESSME_KEYCLOAK_SMTP_STARTTLS: "false"
      GEOGUESSME_KEYCLOAK_SMTP_SSL: "false"
      GEOGUESSME_KEYCLOAK_SMTP_USER: ""
      GEOGUESSME_KEYCLOAK_SMTP_PASSWORD: ""
      GEOGUESSME_KEYCLOAK_SSL_REQUIRED: external
      GEOGUESSME_PRODUCTION_OIDC_CLIENT_SECRET: unused-local-production-secret
      GEOGUESSME_PRODUCTION_REDIRECT_URL: https://geoguessme.com/oauth2/callback
      GEOGUESSME_PRODUCTION_ORIGIN: https://geoguessme.com
      GEOGUESSME_PRODUCTION_POST_LOGOUT_URLS: https://geoguessme.com/*
      GEOGUESSME_DEV_OIDC_CLIENT_SECRET: local-geoguessme-client-secret
      GEOGUESSME_DEV_REDIRECT_URL: https://geoguessme.localhost/oauth2/callback
      GEOGUESSME_DEV_ORIGIN: https://geoguessme.localhost
      GEOGUESSME_DEV_POST_LOGOUT_URLS: https://geoguessme.localhost/*
      GEOGUESSME_GOOGLE_CLIENT_ID: ${GEOGUESSME_GOOGLE_CLIENT_ID:-local-google-placeholder}
      GEOGUESSME_GOOGLE_CLIENT_SECRET: ${GEOGUESSME_GOOGLE_CLIENT_SECRET:-local-google-placeholder}
      GEOGUESSME_GITHUB_CLIENT_ID: ${GEOGUESSME_GITHUB_CLIENT_ID:-local-github-placeholder}
      GEOGUESSME_GITHUB_CLIENT_SECRET: ${GEOGUESSME_GITHUB_CLIENT_SECRET:-local-github-placeholder}
      GEOGUESSME_APPLE_CLIENT_ID: ${GEOGUESSME_APPLE_CLIENT_ID:-local-apple-placeholder}
      GEOGUESSME_APPLE_CLIENT_SECRET: ${GEOGUESSME_APPLE_CLIENT_SECRET:-local-apple-placeholder}
    volumes:
      - ./deployment/keycloak:/opt/geoguessme/keycloak:ro
    tmpfs: ["/tmp"]
    depends_on:
      local-keycloak: { condition: service_healthy }
    restart: "no"

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy@sha256:b1b2021fe8f4004573e8d690dec6c7bb29cc44364572cf8510a05bf3a0ae2ded
    profiles: [social]
    command: ["--config=/etc/oauth2-proxy/oauth2-proxy.cfg", "--alpha-config=/etc/oauth2-proxy/oauth2-proxy-alpha.yaml"]
    environment:
      OIDC_ISSUER_URL: https://auth-dev.geoguessme.com/realms/geoguessme
      OIDC_CLIENT_ID: geoguessme-dev
      OIDC_CLIENT_SECRET: local-geoguessme-client-secret
      OAUTH2_PROXY_COOKIE_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      OAUTH2_PROXY_COOKIE_NAME: __Host-geoguessme_oidc_local
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_REDIRECT_URL: https://geoguessme.localhost/oauth2/callback
      SSL_CERT_DIR: /etc/ssl/certs:/run/local-ca
    volumes:
      - ./deployment/oauth2-proxy/oauth2-proxy.cfg:/etc/oauth2-proxy/oauth2-proxy.cfg:ro
      - ./deployment/oauth2-proxy/oauth2-proxy-alpha.yaml:/etc/oauth2-proxy/oauth2-proxy-alpha.yaml:ro
      - ./.local/caddy:/run/local-ca:ro
    extra_hosts:
      - "auth-dev.geoguessme.com:host-gateway"
    depends_on:
      backend: { condition: service_healthy }
      local-keycloak: { condition: service_healthy }

  local-caddy:
    image: ${CADDY_RUNTIME_IMAGE:?Run through Make or supply the audited Caddy runtime}
    profiles: [social]
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./deployment/caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - ./.local/caddy:/etc/caddy/local-tls:ro
    read_only: true
    tmpfs:
      - /data
      - /config
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    networks:
      default:
        aliases: [auth-dev.geoguessme.com]
    depends_on:
      local-keycloak: { condition: service_healthy }

volumes:
  geoguessme_dev_db:
  geoguessme_dev_s3_fixture:
  # The retired geoguessme_dev_minio volume is deliberately unmanaged: even
  # `down --volumes` must not remove the source of an unfinished migration.
  geoguessme_dev_keycloak_db:
  frontend-node-modules:
