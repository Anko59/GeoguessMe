# General BFF and cookie settings. Provider, upstream, and verified header
# settings live in oauth2-proxy-alpha.yaml so the start endpoint can safely
# allow-list Keycloak's provider, registration, and email-hint parameters.
email_domains = ["*"]
reverse_proxy = true
trusted_proxy_ips = ["172.16.0.0/12"]
api_routes = ["^/api/"]
skip_provider_button = true

cookie_name = "__Host-geoguessme_oidc"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "8h"
cookie_refresh = "15m"
cookie_csrf_per_request = true
cookie_csrf_per_request_limit = 5
