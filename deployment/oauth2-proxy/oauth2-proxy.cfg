# Keycloak BFF for the one server-side session exchange endpoint. Issuer,
# client credentials, redirect URL, and cookie secret are injected through the
# matching OAUTH2_PROXY_* variables in the encrypted deployment environment.
provider = "keycloak-oidc"
email_domains = ["*"]
code_challenge_method = "S256"
scope = "openid email profile"

upstreams = ["http://backend:8080/"]
http_address = "0.0.0.0:4180"
reverse_proxy = true
trusted_proxy_ips = ["172.16.0.0/12"]
pass_host_header = true
pass_authorization_header = true
skip_auth_strip_headers = false
api_routes = ["^/api/"]
skip_provider_button = true

cookie_name = "__Host-geoguessme_oidc"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "8h"
cookie_refresh = "15m"
cookie_csrf_per_request = true
cookie_csrf_per_request_limit = 5
