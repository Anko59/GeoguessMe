# Hosted overlay for the two isolated remote environments. Compose project
# names provide separate networks and volumes while the environment files
# provide independent credentials and external R2 buckets.
services:
  migration:
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  postgres:
    image: postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
    env_file:
      - path: ${GEOGUESSME_ENV_FILE:-deployment/env/production.env}
        required: true
    volumes:
      - database:/var/lib/postgresql/data
    read_only: true
    tmpfs: ["/tmp", "/var/run/postgresql"]
    # The official entrypoint runs as root and drops to postgres: it must chown
    # and re-stat the data directory and create the Unix socket, so keep the
    # minimal ownership/drop-privilege capabilities. Do NOT set user here; the
    # image manages its own uid/gid and the entrypoint requires root to chown.
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    security_opt: ["no-new-privileges:true"]
    networks: [app]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: ${GEOGUESSME_DATABASE_CPUS:-1.0}
          memory: ${GEOGUESSME_DATABASE_MEMORY:-1G}
          pids: 256

volumes:
  database:
