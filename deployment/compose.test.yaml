# Isolated integration/E2E stack. Project name and host ports are supplied by
# the caller (Makefile uses geoguessme-integration / geoguessme-e2e) so the two
# suites never collide. Builds the production frontend gateway (not Vite
# preview) and exposes only the ports the suites need.

services:
  db:
    image: ${POSTGRES_IMAGE:?Run through Make or supply the audited immutable PostgreSQL image}
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: geoguessme_test
    ports: ["${GEOGUESSME_TEST_DB_PORT:-0}:5432"]
    volumes: ["geoguessme_test_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U test -d geoguessme_test"]
      interval: 3s
      timeout: 3s
      retries: 30

  # S3-compatible local fixture. The internal DNS name is retained for clients;
  # SeaweedFS data MUST NOT reuse the retired MinIO volume format.
  minio:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d # SeaweedFS 4.48
    user: "1000:1000"
    command:
      [
        server,
        -s3,
        -dir=/data,
        -ip=minio,
        -ip.bind=0.0.0.0,
        -s3.port=9000,
        -s3.config=/etc/seaweedfs/s3.json,
        "-volume.max=${GEOGUESSME_S3_FIXTURE_VOLUME_MAX:-32}",
        -master.volumeSizeLimitMB=64,
      ]
    volumes:
      - geoguessme_test_s3_fixture:/data
      - ./deployment/s3-fixture/credentials.json:/etc/seaweedfs/s3.json:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    tmpfs: [/tmp]
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "--max-time",
          "2",
          "--aws-sigv4",
          "aws:amz:us-east-1:s3",
          "--user",
          "minioadmin:minioadmin",
          "http://127.0.0.1:9000/",
        ]
      interval: 3s
      timeout: 3s
      retries: 30

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e # Toxiproxy 2.12.0
    command: -host 0.0.0.0 -config /config/toxiproxy.json
    ports: ["${GEOGUESSME_TEST_TOXIPROXY_PORT:-8474}:8474"]
    volumes:
      - ./deployment/docker/toxiproxy-config.json:/config/toxiproxy.json:ro
    depends_on:
      minio: { condition: service_healthy }

  mailpit:
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48 # Mailpit 1.31.4
    ports: ["${GEOGUESSME_TEST_MAILPIT_PORT:-8025}:8025"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8025/"]
      interval: 3s
      timeout: 3s
      retries: 30

  migration:
    image: ${BACKEND_IMAGE:-${LOCAL_BACKEND_IMAGE:?Run through Make or set BACKEND_IMAGE}}
    build:
      context: .
      dockerfile: deployment/docker/backend.Dockerfile
    command: ["migrate", "up"]
    pull_policy: never
    environment:
      DATABASE_URL: postgres://test:test@db:5432/geoguessme_test?sslmode=disable
      JWT_SECRET: test_secret_key_at_least_32_characters_long
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  backend:
    image: ${BACKEND_IMAGE:-${LOCAL_BACKEND_IMAGE:?Run through Make or set BACKEND_IMAGE}}
    build:
      context: .
      dockerfile: deployment/docker/backend.Dockerfile
    command: ["serve"]
    pull_policy: never
    environment:
      APP_ENV: test
      DATABASE_URL: postgres://test:test@db:5432/geoguessme_test?sslmode=disable
      JWT_SECRET: test_secret_key_at_least_32_characters_long
      PUBLIC_URL: ${GEOGUESSME_TEST_PUBLIC_URL:-http://localhost:8080}
      ALLOWED_ORIGINS: ${GEOGUESSME_TEST_ALLOWED_ORIGINS:-http://localhost:8080,http://host.docker.internal:8080}
      S3_ENDPOINT: http://toxiproxy:9000
      S3_REGION: us-east-1
      S3_BUCKET: geoguessme-test-media
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_USE_PATH_STYLE: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: no-reply@test.local
      SMTP_TLS: "off"
      PHOTO_VIEW_WINDOW: 1s
      # Rate-limit policies (F-04). Identity and global buckets keep the
      # mandated limits; the trusted-IP buckets are relaxed because the whole
      # suite shares one client address behind the test gateway. Reset and
      # push stay at the mandated defaults.
      RATE_LIMIT_LOGIN: "identity:10/1m,trustedIP:50000/1m,global:300/1m"
      RATE_LIMIT_SIGNUP: "identity:3/1h,trustedIP:50000/1h,global:1000/1m"
      RATE_LIMIT_EMAIL: "identity:3/1h,trustedIP:50000/1h,global:1000/1m"
      RATE_LIMIT_DEFAULT: "route:120/1m,trustedIP:50000/1m"
      RATE_LIMIT_WRITE: "route:60/1m,trustedIP:50000/1m"
      MEDIA_PROCESSING_WORKER: "true"
    depends_on:
      migration: { condition: service_completed_successfully }
      toxiproxy: { condition: service_started }
      minio: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/usr/local/bin/geoguessme", "healthcheck"]
      interval: 3s
      timeout: 3s
      retries: 30

  web:
    image: ${WEB_IMAGE:-${LOCAL_WEB_IMAGE:?Run through Make or set WEB_IMAGE}}
    build:
      context: .
      dockerfile: deployment/docker/frontend.Dockerfile
    ports: ["${GEOGUESSME_TEST_WEB_PORT:-8080}:80"]
    pull_policy: never
    depends_on:
      backend: { condition: service_healthy }

volumes:
  geoguessme_test_db:
  geoguessme_test_s3_fixture:
