# Independent monitoring topology for the shared hosted VM. This project is
# intentionally separate from the application deployment projects: releasing
# the game must not recreate or remove monitoring state.
name: geoguessme-watch

x-defaults: &defaults
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

services:
  gateway:
    <<: *defaults
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    ports:
      - "127.0.0.1:${GEOGUESSME_WATCH_PORT:-8084}:80"
    volumes:
      - ./watch/Caddyfile:/etc/caddy/Caddyfile:ro
      - gateway_data:/data
      - gateway_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    user: "1000:1000"
    cap_add: ["NET_BIND_SERVICE"]
    networks: [watch, edge]
    depends_on:
      beszel:
        condition: service_healthy
      victoria-logs:
        condition: service_started
      victoria-metrics:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: 64M
          pids: 128

  beszel:
    <<: *defaults
    image: henrygd/beszel:0.19.0@sha256:fefb27166f5e1611ebf67f8697ea928a23f44efdb00af922e2ac3b5faa2efd5c
    environment:
      APP_URL: https://watch.geoguessme.com
      CHECK_UPDATES: "false"
      CONTAINER_DETAILS: "false"
      DISABLE_PASSWORD_AUTH: "false"
    volumes:
      - beszel_data:/beszel_data
      - beszel_socket:/beszel_socket
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    networks: [watch]
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 60s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: 128M
          pids: 128

  beszel-agent:
    <<: *defaults
    image: henrygd/beszel-agent:0.19.0@sha256:00c88600e7d120128f623b2deb5257603d464e841fd68f88cc791dcc075f9e46
    network_mode: host
    env_file:
      - path: ${GEOGUESSME_WATCH_AGENT_ENV:-/etc/geoguessme/watch-agent.env}
        required: false
    environment:
      DOCKER_HOST: tcp://127.0.0.1:2375
      LISTEN: /beszel_socket/beszel.sock
    volumes:
      - beszel_agent_data:/var/lib/beszel-agent
      - beszel_socket:/beszel_socket
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 60s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: 128M
          pids: 128

  socket-proxy:
    <<: *defaults
    image: tecnativa/docker-socket-proxy:0.1.2@sha256:dc8ec925b1360c54e6bf350602d6faac4e33c5d8d809118e4c000c0b14a4529a
    ports:
      - "127.0.0.1:${GEOGUESSME_WATCH_DOCKER_PROXY_PORT:-2375}:2375"
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      PING: "1"
      POST: "0"
      VERSION: "1"
      AUTH: "0"
      EXEC: "0"
      IMAGES: "0"
      INFO: "0"
      NETWORKS: "0"
      VOLUMES: "0"
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    tmpfs:
      - /tmp:size=8m,noexec,nosuid,nodev
    networks: [watch, edge]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:2375/_ping >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: 0.10
          memory: 64M
          pids: 64

  victoria-logs:
    <<: *defaults
    image: victoriametrics/victoria-logs:v1.51.1@sha256:a3ecc79c2a1f3ea3b03ac517dcf45c8f6ecbd65629acfd9140c335e867b13522
    command:
      - -storageDataPath=/victoria-logs-data
      - -retentionPeriod=7d
      - -retention.maxDiskSpaceUsageBytes=2GiB
      - -storage.minFreeDiskSpaceBytes=8GiB
      - -http.pathPrefix=/logs
      - -httpListenAddr=:9428
    volumes:
      - victoria_logs_data:/victoria-logs-data
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    networks: [watch]
    deploy:
      resources:
        limits:
          cpus: 0.50
          memory: 256M
          pids: 128

  victoria-metrics:
    <<: *defaults
    image: victoriametrics/victoria-metrics:v1.152.0@sha256:86ca5fdb6d87d56ba047b044039019ba2bd9042b36e35f6ea34e437b6c825cef
    command:
      - -storageDataPath=/victoria-metrics-data
      - -retentionPeriod=14d
      - -storage.minFreeDiskSpaceBytes=8GiB
      - -memory.allowedBytes=96MiB
      - -search.maxMemoryPerQuery=32MiB
      - -http.pathPrefix=/metrics
      - -httpListenAddr=:8428
      - -promscrape.config=/etc/victoria-metrics/prometheus.yml
    volumes:
      - victoria_metrics_data:/victoria-metrics-data
      - ./watch/victoria-metrics.yaml:/etc/victoria-metrics/prometheus.yml:ro
      - ${GEOGUESSME_WATCH_METRICS_DIR:-/etc/geoguessme/watch-metrics}:/run/watch-metrics:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    networks:
      - watch
      - production_frontend
    depends_on:
      socket-proxy:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: 0.50
          memory: 192M
          pids: 128

  vector:
    <<: *defaults
    image: timberio/vector:0.50.0-alpine@sha256:93761c26fa3a3793f5f200de0f4cfc6102b5e9803ab33b4830d0873ba8dbdc4f
    command: ["--config", "/etc/vector/vector.yaml"]
    volumes:
      - ./watch/vector.yaml:/etc/vector/vector.yaml:ro
      - vector_data:/var/lib/vector
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    networks: [watch]
    depends_on:
      socket-proxy:
        condition: service_healthy
      victoria-logs:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: 160M
          pids: 128

networks:
  watch:
    internal: true
  edge:
  production_frontend:
    external: true
    name: ${GEOGUESSME_PRODUCTION_FRONTEND_NETWORK:-geoguessme-production_frontend}

volumes:
  beszel_data:
  beszel_agent_data:
  beszel_socket:
  gateway_data:
  gateway_config:
  victoria_logs_data:
  victoria_metrics_data:
  vector_data:
