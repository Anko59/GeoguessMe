version: "2"
run:
  tests: true
  timeout: 3m
linters:
  default: none
  settings:
    staticcheck:
      # v1 staticcheck + gosimple; stylecheck and quick-fix rules were not enabled.
      checks: ["SA*", "S*"]
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - bodyclose
    - noctx
  disable:
    - exhaustruct
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
