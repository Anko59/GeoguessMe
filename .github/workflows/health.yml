name: Hosted health

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: monitoring
    steps:
      - name: Check production and protected development
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          curl --fail --silent --show-error --max-time 15 https://geoguessme.com/health/ready >/dev/null
          curl --fail --silent --show-error --max-time 15 \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            https://dev.geoguessme.com/health/ready >/dev/null

  # Authenticated runtime-integrity check: compares the installed, root-owned
  # host runtime definitions (bin scripts, compose files) against the deployed
  # revision over the Cloudflare Access SSH path. Requires the deployment SSH
  # secrets (DEPLOY_SSH_PRIVATE_KEY, DEPLOY_SSH_KNOWN_HOSTS) to be provisioned
  # in the monitoring environment, matching the deploy workflow's Access
  # service-token usage. Fails when the installed host definitions diverge from
  # the recorded revision (out-of-band modification).
  runtime-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: monitoring
    steps:
      - name: Install pinned cloudflared
        run: |
          curl -fsSLo cloudflared.deb https://github.com/cloudflare/cloudflared/releases/download/2026.7.2/cloudflared-linux-amd64.deb
          echo '88195157a136199a86977c122a22084dae6907480bbe3640222b7b55834afc3a  cloudflared.deb' | sha256sum -c -
          sudo dpkg -i cloudflared.deb
      - name: Verify production and development host runtime definitions
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/deploy ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes \
            -o ProxyCommand='cloudflared access ssh --hostname %h' \
            deploy@deploy.geoguessme.com "verify production"
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes \
            -o ProxyCommand='cloudflared access ssh --hostname %h' \
            deploy@deploy.geoguessme.com "verify dev"
