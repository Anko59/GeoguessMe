name: Black-box QA

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact deployed dev revision to test
        required: false
        type: string
  workflow_run:
    workflows: [Deploy development]
    types: [completed]

permissions:
  contents: read

jobs:
  browser:
    name: Source-blind exploratory browser QA
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'dev')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: development
    env:
      QA_BASE_URL: https://dev.geoguessme.com
      QA_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      QA_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      QA_BUILD_SHA: ${{ github.event.workflow_run.head_sha || inputs.revision || github.sha }}
    steps:
      - name: Check out the deployed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.revision || github.sha }}
      - name: Run source-blind QA agent
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QA_BUILD_SHA"
          make bootstrap-e2e
          make qa-agent QA_REPORT_DIR=qa-artifacts
      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: black-box-qa-${{ env.QA_BUILD_SHA }}
          path: qa-artifacts
          retention-days: 7
          if-no-files-found: warn
