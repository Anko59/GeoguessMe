name: Nightly verification

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: geoguessme-nightly-verification
  cancel-in-progress: true

jobs:
  verify:
    name: Complete operational gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: dev
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          buildkitd-config-inline: |
            [worker.oci]
              gc = true
              gckeepstorage = 20000000000
      - name: Restore Docker cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /tmp/.buildx-cache
          key: docker-${{ runner.os }}-nightly-${{ hashFiles('backend/go.sum', 'frontend/package-lock.json') }}
          restore-keys: docker-${{ runner.os }}-nightly-
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.6.5
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve signed dependency artifacts without rebuilding
        run: |
          make resolve-security-images
          while IFS= read -r selection; do printf '%s\n' "$selection" >> "$GITHUB_ENV"; done < .local/security-images.env
      - name: Bootstrap pinned tools
        run: make bootstrap
      - name: Publish maintenance health
        run: make maintenance-report >> "$GITHUB_STEP_SUMMARY"
      - name: Run complete verification
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          # `make verify` scans the local images built by its prerequisites.
          # The docker-container Buildx driver needs --load to put docker-build
          # outputs in the runner's Docker image store before audit-images.
          make verify \
            DOCKER_BUILD_FLAGS="--load --cache-from type=local,src=/tmp/.buildx-cache --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max"
      - name: Save Docker cache
        if: always()
        run: |
          if [[ -d /tmp/.buildx-cache-new ]]; then
            rm -rf /tmp/.buildx-cache
            mv /tmp/.buildx-cache-new /tmp/.buildx-cache
          fi
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: geoguessme-nightly-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/coverage/
            backend/coverage.out
            security/image-reports/**/report.json
            security/image-reports/**/sbom.spdx.json
            security/image-reports/**/gate.txt
            security/image-reports/summary.tsv
            security/image-reports/db-snapshot.json
            security/image-reports/**/*.log
