# Development pipeline. The complete dev gate runs as four parallel jobs
# (quality, backend integration, Chromium E2E, operational rehearsals); the
# full browser matrix and the load profile remain part of the complete nightly
# gate. Publishing waits for all four, then deploys the exact
# signed digest.
name: Deploy development

on:
  push:
    branches: [dev]

concurrency:
  group: geoguessme-development-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
        id: buildx
        with:
          buildkitd-config-inline: |
            [worker.oci]
              gc = true
              gckeepstorage = 20000000000
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /tmp/.buildx-cache
          key: docker-${{ runner.os }}-dev-quality-${{ hashFiles('backend/go.sum', 'frontend/package-lock.json') }}
          restore-keys: docker-${{ runner.os }}-dev-quality-
      - run: make bootstrap
      - name: Run the quality gate
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          make quality \
            DOCKER_BUILD_FLAGS="--cache-from type=local,src=/tmp/.buildx-cache --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max"
      - name: Save Docker cache
        if: always()
        run: |
          if [[ -d /tmp/.buildx-cache-new ]]; then
            rm -rf /tmp/.buildx-cache
            mv /tmp/.buildx-cache-new /tmp/.buildx-cache
          fi

  integration:
    name: Backend integration gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
        id: buildx
        with:
          buildkitd-config-inline: |
            [worker.oci]
              gc = true
              gckeepstorage = 20000000000
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /tmp/.buildx-cache
          key: docker-${{ runner.os }}-dev-integration-${{ hashFiles('backend/go.sum', 'frontend/package-lock.json') }}
          restore-keys: docker-${{ runner.os }}-dev-integration-
      - run: make bootstrap-integration
      - name: Run backend integration
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          make pr-backend \
            DOCKER_BUILD_FLAGS="--cache-from type=local,src=/tmp/.buildx-cache --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max"
      - name: Save Docker cache
        if: always()
        run: |
          if [[ -d /tmp/.buildx-cache-new ]]; then
            rm -rf /tmp/.buildx-cache
            mv /tmp/.buildx-cache-new /tmp/.buildx-cache
          fi

  e2e:
    name: Chromium E2E gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
        id: buildx
        with:
          buildkitd-config-inline: |
            [worker.oci]
              gc = true
              gckeepstorage = 20000000000
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /tmp/.buildx-cache
          key: docker-${{ runner.os }}-dev-e2e-${{ hashFiles('backend/go.sum', 'frontend/package-lock.json') }}
          restore-keys: docker-${{ runner.os }}-dev-e2e-
      - run: make bootstrap-e2e
      - name: Run Chromium E2E (full matrix stays on nightly)
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          GEOGUESSME_E2E_PROJECTS=desktop make test-e2e \
            DOCKER_BUILD_FLAGS="--cache-from type=local,src=/tmp/.buildx-cache --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max"
      - name: Save Docker cache
        if: always()
        run: |
          if [[ -d /tmp/.buildx-cache-new ]]; then
            rm -rf /tmp/.buildx-cache
            mv /tmp/.buildx-cache-new /tmp/.buildx-cache
          fi
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: geoguessme-dev-e2e-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            frontend/playwright-report/
            frontend/test-results/

  operational:
    name: Operational gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
        id: buildx
        with:
          buildkitd-config-inline: |
            [worker.oci]
              gc = true
              gckeepstorage = 20000000000
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /tmp/.buildx-cache
          key: docker-${{ runner.os }}-dev-operational-${{ hashFiles('backend/go.sum', 'frontend/package-lock.json') }}
          restore-keys: docker-${{ runner.os }}-dev-operational-
      - name: Bootstrap operational tools
        run: make bootstrap-operational
      - name: Run operational rehearsals
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          make operational-gate \
            DOCKER_BUILD_FLAGS="--load --cache-from type=local,src=/tmp/.buildx-cache --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max"
      - name: Save Docker cache
        if: always()
        run: |
          if [[ -d /tmp/.buildx-cache-new ]]; then
            rm -rf /tmp/.buildx-cache
            mv /tmp/.buildx-cache-new /tmp/.buildx-cache
          fi

  publish:
    name: Publish signed development images
    needs: [quality, integration, e2e, operational]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: write
    outputs:
      backend: ${{ steps.refs.outputs.backend }}
      web: ${{ steps.refs.outputs.web }}
      restic: ${{ steps.refs.outputs.restic }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve registry names
        id: names
        run: |
          owner=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          {
            echo "backend=ghcr.io/$owner/geoguessme-backend:dev-${GITHUB_SHA}"
            echo "web=ghcr.io/$owner/geoguessme-web:dev-${GITHUB_SHA}"
            echo "restic=ghcr.io/$owner/geoguessme-restic:dev-${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push backend with SBOM and provenance
        id: backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: deployment/docker/backend.Dockerfile
          push: true
          tags: ${{ steps.names.outputs.backend }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=dev-backend
          cache-to: type=gha,mode=max,scope=dev-backend
      - name: Build and push web with SBOM and provenance
        id: web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: deployment/docker/frontend.Dockerfile
          push: true
          tags: ${{ steps.names.outputs.web }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=dev-web
          cache-to: type=gha,mode=max,scope=dev-web
      - name: Build and push patched Restic with SBOM and provenance
        id: restic
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: deployment/docker/restic-tools.Dockerfile
          push: true
          tags: ${{ steps.names.outputs.restic }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=dev-restic
          cache-to: type=gha,mode=max,scope=dev-restic
      - name: Sign immutable images
        env:
          BACKEND: ${{ steps.names.outputs.backend }}@${{ steps.backend.outputs.digest }}
          WEB: ${{ steps.names.outputs.web }}@${{ steps.web.outputs.digest }}
          RESTIC: ${{ steps.names.outputs.restic }}@${{ steps.restic.outputs.digest }}
        run: |
          for image in "$BACKEND" "$WEB" "$RESTIC"; do
            cosign sign --yes -a "revision=$GITHUB_SHA" "$image"
          done
      - name: Export immutable references
        id: refs
        run: |
          {
            echo "backend=${{ steps.names.outputs.backend }}@${{ steps.backend.outputs.digest }}"
            echo "web=${{ steps.names.outputs.web }}@${{ steps.web.outputs.digest }}"
            echo "restic=${{ steps.names.outputs.restic }}@${{ steps.restic.outputs.digest }}"
          } >> "$GITHUB_OUTPUT"
      - name: Scan published images for fixed High/Critical CVEs
        # Runs `make audit-images` (trivy via compose.tools) against the exact
        # pushed digests. Fails the job when a FIXED High/Critical finding is
        # present (--exit-code 1); unfixed findings are reported but do not block.
        env:
          BACKEND_IMAGE: ${{ steps.names.outputs.backend }}@${{ steps.backend.outputs.digest }}
          WEB_IMAGE: ${{ steps.names.outputs.web }}@${{ steps.web.outputs.digest }}
          RESTIC_IMAGE: ${{ steps.names.outputs.restic }}@${{ steps.restic.outputs.digest }}
        run: |
          # Buildx pushes without loading the images into the runner. Pull the
          # authenticated exact digests so audit-images can export them for
          # credential-less Trivy scanning.
          docker pull "$BACKEND_IMAGE"
          docker pull "$WEB_IMAGE"
          docker pull "$RESTIC_IMAGE"
          make audit-images
      - name: Upload image-scan reports and SBOMs
        # Reports/SBOM contain no secrets; retained 7 days. Globbing only the
        # report and SBOM files keeps the trivy DB cache
        # (security/image-reports/.trivy-cache) out of the artifact.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: image-scan-reports-${{ github.sha }}
          path: |
            security/image-reports/**/report.json
            security/image-reports/**/sbom.spdx.json
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy development digest
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    concurrency:
      group: geoguessme-host-deployment
      cancel-in-progress: false
    steps:
      - name: Install pinned cloudflared
        run: |
          curl -fsSLo cloudflared.deb https://github.com/cloudflare/cloudflared/releases/download/2026.8.0/cloudflared-linux-amd64.deb
          echo '81b5cd625beae2b64e025073402a69c0e8571aeda45a1f4726e33adab3e5824d  cloudflared.deb' | sha256sum -c -
          sudo dpkg -i cloudflared.deb
      - name: Deploy through Cloudflare Access
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          BACKEND: ${{ needs.publish.outputs.backend }}
          WEB: ${{ needs.publish.outputs.web }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/deploy ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes \
            -o ProxyCommand='cloudflared access ssh --hostname %h' \
            deploy@deploy.geoguessme.com \
            "deploy $BACKEND $WEB $GITHUB_SHA"
