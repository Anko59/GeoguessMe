# Development pipeline. The complete dev gate runs as five parallel jobs
# (quality, backend integration, Chromium E2E, Android emulator, operational
# rehearsals); the full browser matrix and the load profile remain part of the
# complete nightly gate. Publishing waits for all five, then deploys the exact
# signed digest.
name: Deploy development

on:
  push:
    branches: [dev]

concurrency:
  group: geoguessme-development-pipeline
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  dependencies:
    name: Prepare immutable dependency artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: geoguessme-dependency-publication
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      keycloak: ${{ steps.dependencies.outputs.keycloak }}
      restic: ${{ steps.dependencies.outputs.restic }}
      sops: ${{ steps.dependencies.outputs.sops }}
      socket_proxy: ${{ steps.dependencies.outputs.socket_proxy }}
      postgres: ${{ steps.dependencies.outputs.postgres }}
      cloudflared: ${{ steps.dependencies.outputs.cloudflared }}
      caddy_runtime: ${{ steps.dependencies.outputs.caddy_runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.6.5
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: make bootstrap-security-tools
      - name: Publish changed dependency inputs or verify existing digests
        id: dependencies
        run: make publish-security-images
      - name: Upload dependency scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-scans-${{ github.sha }}
          path: security/image-reports/
          retention-days: 7
          if-no-files-found: ignore

  quality:
    needs: dependencies
    env:
      KEYCLOAK_IMAGE: ${{ needs.dependencies.outputs.keycloak }}
      RESTIC_IMAGE: ${{ needs.dependencies.outputs.restic }}
      SOPS_IMAGE: ${{ needs.dependencies.outputs.sops }}
      SOCKET_PROXY_IMAGE: ${{ needs.dependencies.outputs.socket_proxy }}
      POSTGRES_IMAGE: ${{ needs.dependencies.outputs.postgres }}
      CLOUDFLARED_IMAGE: ${{ needs.dependencies.outputs.cloudflared }}
      CADDY_RUNTIME_IMAGE: ${{ needs.dependencies.outputs.caddy_runtime }}
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        id: buildx
        with:
          buildkitd-config-inline: |
            [worker.oci]
              gc = true
              gckeepstorage = 20000000000
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /tmp/.buildx-cache
          key: docker-${{ runner.os }}-dev-quality-${{ hashFiles('backend/go.sum', 'frontend/package-lock.json') }}
          restore-keys: docker-${{ runner.os }}-dev-quality-
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.6.5
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: make bootstrap
      - name: Run the quality gate
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          make quality \
            DOCKER_BUILD_FLAGS="--cache-from type=local,src=/tmp/.buildx-cache --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max"
      - name: Save Docker cache
        if: always()
        run: |
          if [[ -d /tmp/.buildx-cache-new ]]; then
            rm -rf /tmp/.buildx-cache
            mv /tmp/.buildx-cache-new /tmp/.buildx-cache
          fi

  integration:
    needs: dependencies
    env:
      KEYCLOAK_IMAGE: ${{ needs.dependencies.outputs.keycloak }}
      RESTIC_IMAGE: ${{ needs.dependencies.outputs.restic }}
      SOPS_IMAGE: ${{ needs.dependencies.outputs.sops }}
      SOCKET_PROXY_IMAGE: ${{ needs.dependencies.outputs.socket_proxy }}
      POSTGRES_IMAGE: ${{ needs.dependencies.outputs.postgres }}
      CLOUDFLARED_IMAGE: ${{ needs.dependencies.outputs.cloudflared }}
      CADDY_RUNTIME_IMAGE: ${{ needs.dependencies.outputs.caddy_runtime }}
    name: Backend integration gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        id: buildx
        with:
          buildkitd-config-inline: |
            [worker.oci]
              gc = true
              gckeepstorage = 20000000000
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /tmp/.buildx-cache
          key: docker-${{ runner.os }}-dev-integration-${{ hashFiles('backend/go.sum', 'frontend/package-lock.json') }}
          restore-keys: docker-${{ runner.os }}-dev-integration-
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.6.5
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: make bootstrap-integration
      - name: Run backend integration
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          make pr-backend \
            DOCKER_BUILD_FLAGS="--cache-from type=local,src=/tmp/.buildx-cache --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max"
      - name: Save Docker cache
        if: always()
        run: |
          if [[ -d /tmp/.buildx-cache-new ]]; then
            rm -rf /tmp/.buildx-cache
            mv /tmp/.buildx-cache-new /tmp/.buildx-cache
          fi

  e2e:
    needs: dependencies
    env:
      KEYCLOAK_IMAGE: ${{ needs.dependencies.outputs.keycloak }}
      RESTIC_IMAGE: ${{ needs.dependencies.outputs.restic }}
      SOPS_IMAGE: ${{ needs.dependencies.outputs.sops }}
      SOCKET_PROXY_IMAGE: ${{ needs.dependencies.outputs.socket_proxy }}
      POSTGRES_IMAGE: ${{ needs.dependencies.outputs.postgres }}
      CLOUDFLARED_IMAGE: ${{ needs.dependencies.outputs.cloudflared }}
      CADDY_RUNTIME_IMAGE: ${{ needs.dependencies.outputs.caddy_runtime }}
    name: Chromium E2E gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        id: buildx
        with:
          buildkitd-config-inline: |
            [worker.oci]
              gc = true
              gckeepstorage = 20000000000
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /tmp/.buildx-cache
          key: docker-${{ runner.os }}-dev-e2e-${{ hashFiles('backend/go.sum', 'frontend/package-lock.json') }}
          restore-keys: docker-${{ runner.os }}-dev-e2e-
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.6.5
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: make bootstrap-e2e
      - name: Run Chromium E2E (full matrix stays on nightly)
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          GEOGUESSME_E2E_PROJECTS=desktop make test-e2e \
            DOCKER_BUILD_FLAGS="--cache-from type=local,src=/tmp/.buildx-cache --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max"
      - name: Save Docker cache
        if: always()
        run: |
          if [[ -d /tmp/.buildx-cache-new ]]; then
            rm -rf /tmp/.buildx-cache
            mv /tmp/.buildx-cache-new /tmp/.buildx-cache
          fi
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: geoguessme-dev-e2e-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            frontend/playwright-report/
            frontend/test-results/

  mobile:
    name: Android emulator gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Bootstrap mobile tools
        run: make bootstrap-mobile
      - name: Run Android emulator journey
        run: make test-mobile
      - name: Upload Android diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: geoguessme-dev-mobile-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: .local/mobile/artifacts/

  operational:
    needs: dependencies
    env:
      KEYCLOAK_IMAGE: ${{ needs.dependencies.outputs.keycloak }}
      RESTIC_IMAGE: ${{ needs.dependencies.outputs.restic }}
      SOPS_IMAGE: ${{ needs.dependencies.outputs.sops }}
      SOCKET_PROXY_IMAGE: ${{ needs.dependencies.outputs.socket_proxy }}
      POSTGRES_IMAGE: ${{ needs.dependencies.outputs.postgres }}
      CLOUDFLARED_IMAGE: ${{ needs.dependencies.outputs.cloudflared }}
      CADDY_RUNTIME_IMAGE: ${{ needs.dependencies.outputs.caddy_runtime }}
    name: Operational gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        id: buildx
        with:
          buildkitd-config-inline: |
            [worker.oci]
              gc = true
              gckeepstorage = 20000000000
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /tmp/.buildx-cache
          key: docker-${{ runner.os }}-dev-operational-${{ hashFiles('backend/go.sum', 'frontend/package-lock.json') }}
          restore-keys: docker-${{ runner.os }}-dev-operational-
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.6.5
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bootstrap operational tools
        run: make bootstrap-operational
      - name: Run operational rehearsals
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          make operational-gate \
            DOCKER_BUILD_FLAGS="--load --cache-from type=local,src=/tmp/.buildx-cache --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max"
      - name: Save Docker cache
        if: always()
        run: |
          if [[ -d /tmp/.buildx-cache-new ]]; then
            rm -rf /tmp/.buildx-cache
            mv /tmp/.buildx-cache-new /tmp/.buildx-cache
          fi

  publish:
    name: Publish signed development images
    needs: [dependencies, quality, integration, e2e, mobile, operational]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: write
    outputs:
      backend: ${{ steps.refs.outputs.backend }}
      web: ${{ steps.refs.outputs.web }}
      keycloak: ${{ steps.refs.outputs.keycloak }}
      restic: ${{ steps.refs.outputs.restic }}
      sops: ${{ steps.refs.outputs.sops }}
      socket_proxy: ${{ steps.refs.outputs.socket_proxy }}
      caddy_runtime: ${{ steps.refs.outputs.caddy_runtime }}
      cloudflared: ${{ steps.refs.outputs.cloudflared }}
      postgres: ${{ steps.refs.outputs.postgres }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: make bootstrap-security-tools
      - name: Resolve registry names
        id: names
        run: |
          owner=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          {
            echo "backend=ghcr.io/$owner/geoguessme-backend:dev-${GITHUB_SHA}"
            echo "web=ghcr.io/$owner/geoguessme-web:dev-${GITHUB_SHA}"
            echo "keycloak=ghcr.io/$owner/geoguessme-keycloak:dev-${GITHUB_SHA}"
            echo "restic=ghcr.io/$owner/geoguessme-restic:dev-${GITHUB_SHA}"
            echo "sops=ghcr.io/$owner/geoguessme-sops:dev-${GITHUB_SHA}"
            echo "socket_proxy=ghcr.io/$owner/geoguessme-socket-proxy:dev-${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push backend with SBOM and provenance
        id: backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: deployment/docker/backend.Dockerfile
          push: true
          tags: ${{ steps.names.outputs.backend }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=dev-backend
          cache-to: type=gha,mode=max,scope=dev-backend
      - name: Build and push web with SBOM and provenance
        id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: deployment/docker/frontend.Dockerfile
          build-args: CADDY_RUNTIME_IMAGE=${{ needs.dependencies.outputs.caddy_runtime }}
          push: true
          tags: ${{ steps.names.outputs.web }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=dev-web
          cache-to: type=gha,mode=max,scope=dev-web
      - name: Scan the complete runtime inventory and exact application digests
        env:
          KEYCLOAK_IMAGE: ${{ needs.dependencies.outputs.keycloak }}
          RESTIC_IMAGE: ${{ needs.dependencies.outputs.restic }}
          SOPS_IMAGE: ${{ needs.dependencies.outputs.sops }}
          SOCKET_PROXY_IMAGE: ${{ needs.dependencies.outputs.socket_proxy }}
          POSTGRES_IMAGE: ${{ needs.dependencies.outputs.postgres }}
          CLOUDFLARED_IMAGE: ${{ needs.dependencies.outputs.cloudflared }}
          CADDY_RUNTIME_IMAGE: ${{ needs.dependencies.outputs.caddy_runtime }}
          BACKEND_IMAGE: ${{ steps.names.outputs.backend }}@${{ steps.backend.outputs.digest }}
          WEB_IMAGE: ${{ steps.names.outputs.web }}@${{ steps.web.outputs.digest }}
        run: make audit-images
      - name: Adopt unchanged dependency digests for this revision
        id: adoption
        env:
          KEYCLOAK_IMAGE: ${{ needs.dependencies.outputs.keycloak }}
          RESTIC_IMAGE: ${{ needs.dependencies.outputs.restic }}
          SOPS_IMAGE: ${{ needs.dependencies.outputs.sops }}
          SOCKET_PROXY_IMAGE: ${{ needs.dependencies.outputs.socket_proxy }}
          POSTGRES_IMAGE: ${{ needs.dependencies.outputs.postgres }}
          CLOUDFLARED_IMAGE: ${{ needs.dependencies.outputs.cloudflared }}
          CADDY_RUNTIME_IMAGE: ${{ needs.dependencies.outputs.caddy_runtime }}
        run: bash tools/quality/dependency-images/adopt.sh
      - name: Export immutable references
        id: refs
        run: |
          {
            echo "backend=${{ steps.names.outputs.backend }}@${{ steps.backend.outputs.digest }}"
            echo "web=${{ steps.names.outputs.web }}@${{ steps.web.outputs.digest }}"
            echo "keycloak=${{ steps.adoption.outputs.keycloak }}"
            echo "restic=${{ steps.adoption.outputs.restic }}"
            echo "sops=${{ steps.adoption.outputs.sops }}"
            echo "socket_proxy=${{ steps.adoption.outputs.socket_proxy }}"
            echo "postgres=${{ steps.adoption.outputs.postgres }}"
            echo "cloudflared=${{ steps.adoption.outputs.cloudflared }}"
            echo "caddy_runtime=${{ steps.adoption.outputs.caddy_runtime }}"
          } >> "$GITHUB_OUTPUT"
      - name: Verify SOPS package is anonymously pullable
        env:
          SOPS_IMAGE: ${{ steps.adoption.outputs.sops }}
        run: |
          set -euo pipefail
          [[ "$SOPS_IMAGE" == ghcr.io/*@sha256:* ]]
          ref=${SOPS_IMAGE#ghcr.io/}
          tagged_image=${ref%@*}
          repository=${tagged_image%:*}
          digest=${ref#*@}
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          token=$(curl -fsS --get \
            --data-urlencode 'service=ghcr.io' \
            --data-urlencode "scope=repository:$repository:pull" \
            https://ghcr.io/token | jq -er '.token // .access_token')
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --head \
            --header "Authorization: Bearer $token" \
            --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/$repository/manifests/$digest")
          [[ "$status" == 200 ]] || {
            echo "SOPS image must be anonymously pullable before hosted secret decryption (HTTP $status)" >&2
            exit 1
          }
      - name: Sign application images after the exact-digest audit
        env:
          BACKEND: ${{ steps.names.outputs.backend }}@${{ steps.backend.outputs.digest }}
          WEB: ${{ steps.names.outputs.web }}@${{ steps.web.outputs.digest }}
        run: |
          for image in "$BACKEND" "$WEB"; do
            cosign sign --yes -a "revision=$GITHUB_SHA" "$image"
          done
      - name: Upload scan reports and SBOMs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: image-scan-dev-${{ github.sha }}
          path: |
            security/image-reports/**/report.json
            security/image-reports/**/sbom.spdx.json
            security/image-reports/**/gate.txt
            security/image-reports/**/policy.rego
            security/image-reports/summary.tsv
            security/image-reports/db-snapshot.json
            security/image-reports/kev.json
            security/image-reports/kev.sha256
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: Deploy development digest
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    concurrency:
      group: geoguessme-host-deployment
      cancel-in-progress: false
    steps:
      - name: Require verified operator runtime cutover
        env:
          PROTOCOL_READY: ${{ vars.HOSTED_DEPENDENCY_PROTOCOL_READY }}
        run: '[ "$PROTOCOL_READY" = true ] || { echo "Install and verify the reviewed utility-aware root runtime bundle first." >&2; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install checksum-verified Cloudflared
        run: bash tools/quality/dependency-images/install-host-tool.sh
      - name: Deploy through Cloudflare Access
        # Install the reviewed root-owned runtime bundle before activating this
        # utility-aware protocol; CI cannot replace root-owned host definitions.
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          BACKEND: ${{ needs.publish.outputs.backend }}
          WEB: ${{ needs.publish.outputs.web }}
          SOPS: ${{ needs.publish.outputs.sops }}
          POSTGRES: ${{ needs.publish.outputs.postgres }}
          RESTIC: ${{ needs.publish.outputs.restic }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/deploy ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes \
            -o ProxyCommand='cloudflared access ssh --hostname %h' \
            deploy@deploy.geoguessme.com \
            "deploy $BACKEND $WEB $SOPS $POSTGRES $RESTIC $GITHUB_SHA"
