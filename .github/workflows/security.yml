name: Security

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: "17 4 * * 1"
  # No artifact inputs: this dispatch can recover only the reviewed Keycloak index.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-reviewed-keycloak:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && github.ref_protected && github.repository == 'Anko59/GeoguessMe'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    concurrency:
      group: geoguessme-dependency-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-buildx
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.6.5
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bootstrap pinned audit helpers
        run: make bootstrap-security-tools
      - name: Review, scan and recover only the original Keycloak digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: make recover-reviewed-keycloak
      - name: Upload exact-digest recovery scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reviewed-keycloak-recovery-${{ github.run_id }}
          path: security/image-reports/
          retention-days: 7
          if-no-files-found: ignore

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  codeql:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2

  audit-images:
    if: github.event_name == 'schedule' || (github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    concurrency:
      group: geoguessme-dependency-publication
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.sha }}
      - uses: ./.github/actions/setup-buildx
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.6.5
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: make bootstrap-security-tools
      - name: Explicit dependency preparation (only changed inputs build)
        if: github.event_name == 'push' && github.ref_name == 'dev'
        run: make publish-security-images
      - name: Resolve existing signed dependencies without rebuilding
        if: github.event_name != 'push' || github.ref_name != 'dev'
        run: make resolve-security-images
      # Publication scans backend/web exact digests; do not race it with mutable
      # app tags here. The complete deployment dependency inventory is mandatory.
      - name: Scan final images for fixed High/Critical findings
        run: |
          set -a
          . .local/security-images.env
          set +a
          make audit-images AUDIT_APPLICATION_IMAGES=false
      - name: Upload scan reports and SBOMs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: image-scan-weekly
          path: security/image-reports/
          retention-days: 7
          if-no-files-found: ignore
