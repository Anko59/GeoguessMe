name: Security

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938

  audit-images:
    if: github.event_name == 'schedule' || (github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # F-01: weekly and branch-push image gate. `make audit-images` scans the
      # digest-pinned third-party runtime/deployment image set (backend, web,
      # database, deployment utilities, and privileged tool images) and fails
      # on fixed High/Critical findings. Application images are scanned at
      # publication (deploy.yml) and promotion (release.yml) where the exact
      # digest is known; this job does not scan a mutable `:dev` tag (none is
      # published) or `dev-${SHA}` (would race deploy.yml and is not
      # reproducible). Scanning app images here would additionally require
      # trivy registry credentials inside the tool container (the trivy
      # service has no host docker auth mount).
      - name: Scan final images for fixed High/Critical findings
        run: make audit-images
      - name: Upload scan reports and SBOMs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: image-scan-weekly
          path: security/image-reports/
          retention-days: 7
          if-no-files-found: ignore
