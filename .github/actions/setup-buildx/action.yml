name: Set up cached Docker builders
description: Configure both CI Docker pull paths without changing upstream image ownership or pins.
inputs:
  buildkitd-config-inline:
    description: Additional BuildKit configuration, including the job's existing cache bound.
    required: false
    default: ""
outputs:
  name:
    description: Selected Buildx builder name.
    value: ${{ steps.buildx.outputs.name }}
runs:
  using: composite
  steps:
    - shell: bash
      run: make ci-registry-cache
    - id: buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      with:
        buildkitd-config-inline: |
          [registry."docker.io"]
            mirrors = ["mirror.gcr.io"]
          ${{ inputs.buildkitd-config-inline }}
